---
configuration:
  log_level:
    name: Log Level
    description: "Log verbosity. Use info for normal operation, debug only for troubleshooting."
  cron_schedule:
    name: Cron Schedule
    description: "Standard 5-field cron expression for when backups run. Default: '0 3 * * *' (daily at 3 AM)."
  repository:
    name: Restic Repository
    description: "Restic repository location. Local path (e.g. /share/restic-backup/repo), or a remote URI (e.g. s3:https://minio.local/bucket, sftp:user@host:/path). See restic docs for supported backends."
  restic_password:
    name: Restic Password
    description: "Encryption password for the restic repository. Required — losing this means losing access to all backups. Store it somewhere safe outside this add-on."
  backup_paths:
    name: Backup Paths
    description: "Which mapped folders to back up. Defaults to /homeassistant, /addon_configs, /ssl. Add /media or /share if needed (must be mapped in the add-on's 'map' config)."
  exclude_patterns:
    name: Exclude Patterns
    description: "Glob patterns passed to restic --exclude, e.g. '*.log' or '**/__pycache__'."
  retention_daily:
    name: Keep Daily
    description: "Number of daily snapshots to keep after pruning."
  retention_weekly:
    name: Keep Weekly
    description: "Number of weekly snapshots to keep after pruning."
  retention_monthly:
    name: Keep Monthly
    description: "Number of monthly snapshots to keep after pruning."
  run_on_start:
    name: Run On Start
    description: "Run one backup immediately when the add-on starts, in addition to the cron schedule. Useful for testing a new configuration."
  aws_access_key_id:
    name: S3 Access Key ID
    description: "Only needed for S3/MinIO/B2-compatible repositories. Leave empty for a local repository."
  aws_secret_access_key:
    name: S3 Secret Access Key
    description: "Only needed for S3/MinIO/B2-compatible repositories. Leave empty for a local repository."
  aws_default_region:
    name: S3 Region
    description: "Only needed for some S3-compatible backends. Leave empty if your backend doesn't require it."
  ntfy_url:
    name: ntfy Server URL
    description: "Base URL of your ntfy server, e.g. https://ntfy.your-domain.com. Leave empty to disable notifications."
  ntfy_topic:
    name: ntfy Topic
    description: "Topic to publish backup results to, e.g. ha-system."
  ntfy_username:
    name: ntfy Username
    description: "Optional — only needed if the ntfy topic requires authentication."
  ntfy_password:
    name: ntfy Password
    description: "Optional — only needed if the ntfy topic requires authentication."
