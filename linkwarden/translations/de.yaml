---
configuration:
  log_level:
    name: Log-Level
    description: >-
      Ausführlichkeit der Log-Ausgabe von Linkwarden und PostgreSQL. Debug nur
      zur Fehlersuche verwenden. Außer bei debug werden sehr lange Meldungen
      gekürzt (zum Beispiel ein ganzes Stylesheet, das eine Seite Linkwarden
      ausgeben lässt).
  public_url:
    name: Öffentliche URL
    description: >-
      Adresse, unter der du Linkwarden öffnest, zum Beispiel
      http://homeassistant.local:3200 oder https://links.example.org. Die
      Anmeldung funktioniert nur über diese Adresse. Leer =
      http://localhost:3200 (es wird eine Warnung geloggt).
  browser_url:
    name: URL des externen Browsers
    description: >-
      Optionaler externer Browser für PDFs und Screenshots, zum Beispiel
      Browserless (ws://host:3000?token=...). Die URL enthält meist ein Token
      und wird deshalb wie ein Passwort gespeichert. Leer = der eingebaute
      Chromium. Ist der externe Browser beim Start des Workers nicht
      erreichbar, wird der eingebaute genutzt und eine Warnung geloggt.
  disable_browser:
    name: Archivierung abschalten
    description: >-
      Schaltet das Archivieren von Webseiten komplett aus: Es entstehen weder
      PDF, Screenshot, Webseiten-Kopie noch Lesemodus, nur der Link wird
      gespeichert. Chromium wird trotzdem gestartet.
  disable_registration:
    name: Registrierung schließen
    description: >-
      Lehnt neue Konten ab. Lege zuerst dein eigenes Konto an und schalte das
      danach ein; ist es an, bevor das erste Konto existiert, kann sich
      niemand registrieren. Solange es aus ist, ist die Registrierung offen.
  archive_take_count:
    name: Links pro Runde
    description: >-
      Wie viele Links der Worker pro Runde nimmt, zum Archivieren und für das
      automatische Taggen. 1 ist am schonendsten für einen Raspberry Pi; nur
      erhöhen, wenn der Host reichlich RAM und CPU hat.
  browser_timeout:
    name: Zeitlimit des Browsers (Minuten)
    description: >-
      Längste Zeit, die eine Archivierung den Browser offen halten darf, in
      Minuten. Dauert es länger, stoppt Linkwarden den Worker (die App startet
      ihn neu) und das Log sagt es. 0 = der Standard von Linkwarden.
  pdf_max_buffer:
    name: Größtes PDF (MB)
    description: >-
      Größtes PDF, das behalten wird, in Megabyte. Eine größere Seite bekommt
      kein PDF (das Log meldet Buffer size exceeded). 0 = der Standard von
      Linkwarden.
  screenshot_max_buffer:
    name: Größter Screenshot (MB)
    description: >-
      Größter Screenshot, der behalten wird, in Megabyte. 0 = der Standard
      von Linkwarden.
  index_take_count:
    name: Links pro Runde der Suchindizierung
    description: >-
      Wie viele Links der Suchindex pro Runde verarbeitet. 0 = der Standard
      von Linkwarden.
  env_vars:
    name: Zusätzliche Umgebungsvariablen
    description: >-
      Einstellungen von Linkwarden, für die es hier keine eigene Option gibt,
      zum Beispiel E-Mail, Single Sign-on, KI-Tags oder ein Proxy. Jeder
      Eintrag ist ein Variablenname mit Wert. Die Werte werden wie Passwörter
      ausgeblendet und nie ins Log geschrieben. Ein Name, den die App selbst
      setzt, wird abgelehnt: Die App startet dann nicht, und das Log nennt den
      Eintrag (siehe Dokumentation).
    fields:
      name:
        name: Variablenname
        description: Name der Umgebungsvariable, zum Beispiel EMAIL_FROM.
      value:
        name: Wert
        description: Wert der Variable.
network:
  3200/tcp: Linkwarden-Weboberfläche und API (Anmeldung erforderlich)
