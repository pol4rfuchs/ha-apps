---
configuration:
  log_level:
    name: Log level
    description: >-
      Verbosity of the log output of Linkwarden and PostgreSQL. Use debug only
      for troubleshooting. Except at debug, very long messages are cut (for
      example a whole style sheet that a page makes Linkwarden print).
  public_url:
    name: Public URL
    description: >-
      Address under which you open Linkwarden, for example
      http://homeassistant.local:3200 or https://links.example.org. Logging in
      only works through this address. Empty = http://localhost:3200 (a
      warning is logged).
  browser_url:
    name: Remote browser URL
    description: >-
      Optional remote browser for PDFs and screenshots, for example Browserless
      (ws://host:3000?token=...). The URL usually contains a token, so it is
      stored like a password. Empty = the built-in Chromium. If the remote
      browser cannot be reached when the worker starts, the built-in one is used
      and a warning is logged.
  disable_browser:
    name: Disable archiving
    description: >-
      Switches the archiving of web pages off completely: no PDF, screenshot,
      web page copy or readable view is created, only the link is saved.
      Chromium is still started.
  disable_registration:
    name: Close sign-up
    description: >-
      Refuses new accounts. Create your own account first and switch this on
      afterwards; with it on before the first account exists nobody can sign
      up. Sign-up is open as long as this is off.
  archive_take_count:
    name: Links per round
    description: >-
      How many links the worker takes per round, for archiving and for the
      automatic tagging. 1 is the gentlest for a Raspberry Pi; raise it only
      if the host has plenty of RAM and CPU.
  browser_timeout:
    name: Browser time limit (minutes)
    description: >-
      Longest time one archiving session may keep the browser open, in minutes.
      If it takes longer, Linkwarden stops the worker (the app restarts it) and
      the log says so. 0 = the default of Linkwarden.
  pdf_max_buffer:
    name: Largest PDF (MB)
    description: >-
      Largest PDF that is kept, in megabytes. A bigger page gets no PDF (the
      log says Buffer size exceeded). 0 = the default of Linkwarden.
  screenshot_max_buffer:
    name: Largest screenshot (MB)
    description: >-
      Largest screenshot that is kept, in megabytes. 0 = the default of
      Linkwarden.
  index_take_count:
    name: Links per search index round
    description: >-
      How many links the search index processes per round. 0 = the
      default of Linkwarden.
  env_vars:
    name: Additional environment variables
    description: >-
      Settings of Linkwarden that have no option here, for example e-mail,
      single sign-on, AI tagging or a proxy. Every entry is a variable name and
      its value. The values are hidden like passwords and never written to the
      log. A name that the app sets itself is refused: the app does not start
      and the log names the entry (see the documentation).
    fields:
      name:
        name: Variable name
        description: Name of the environment variable, for example EMAIL_FROM.
      value:
        name: Value
        description: Value of the variable.
network:
  3200/tcp: Linkwarden web UI and API (login required)
