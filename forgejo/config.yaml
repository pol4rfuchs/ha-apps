---
name: Forgejo
version: "16.0.21"
slug: forgejo
description: >-
  Self-hosted Git platform – the free GitHub alternative. Repositories,
  issues, pull requests, CI/CD actions, package registry, wiki, projects and
  more.
url: https://github.com/pol4rfuchs/ha-apps
apparmor: false
arch:
  - amd64
  - aarch64
image: ghcr.io/pol4rfuchs/forgejo
stage: experimental
init: false
ingress: false
webui: http://[HOST]:[PORT:3000]
panel_icon: mdi:git
panel_title: Forgejo
map:
  - type: addon_config
    read_only: false
  - type: ssl
    read_only: true
ports:
  3000/tcp: 3000
  22/tcp: null
ports_description:
  3000/tcp: Web UI (direct access – the host port must stay 3000)
  22/tcp: 'SSH Git access (only needed if ssh_enabled: true)'
options:
  app_name: Forgejo
  domain: ''
  ssl: false
  certfile: fullchain.pem
  keyfile: privkey.pem
  ssh_enabled: false
  ssh_port: 22
  log_level: Info
schema:
  app_name: str
  domain: str
  ssl: bool
  certfile: str
  keyfile: str
  ssh_enabled: bool
  ssh_port: int
  log_level: list(Trace|Debug|Info|Warn|Error|Critical|Fatal)
