---
configuration:
  log_level:
    name: Log Level
    description: "Log verbosity. Use INFO for normal operation, DEBUG only for troubleshooting."
  base_url:
    name: Base URL
    description: "External URL of your ntfy server (e.g. https://ntfy.your-domain.com). Required for attachments, iOS push, and UnifiedPush / Matrix Push Gateway. Without this, /_matrix/push/v1/notify is unavailable and Android push via UnifiedPush will not work."
  behind_proxy:
    name: Behind Proxy
    description: "Enable if ntfy runs behind Nginx/Traefik/Caddy. Reads real client IP from X-Forwarded-For."
  auth_default_access:
    name: Default Access
    description: "Access level for unauthenticated requests. 'deny-all' recommended when users are configured."
  enable_signup:
    name: Enable Signup
    description: "Allow users to self-register via the web UI."
  enable_login:
    name: Enable Login
    description: "Show login form in the web UI. Recommended when users are configured."
  enable_reservations:
    name: Topic Reservations
    description: "Allow users to reserve topic names."
  cache_duration:
    name: Cache Duration
    description: "How long messages are cached. Format: 12h, 7d, etc."
  attachment_total_size_limit:
    name: Attachment Total Limit
    description: "Maximum total storage for all attachments. Example: 5G, 500M. Requires base_url."
  attachment_file_size_limit:
    name: Attachment File Limit
    description: "Maximum size of a single attachment. Example: 15M. Requires base_url."
  attachment_expiry_duration:
    name: Attachment Expiry
    description: "How long attachments are kept. Example: 3h, 24h. Requires base_url."
  keepalive_interval:
    name: Keepalive Interval
    description: "Keepalive interval sent to connected clients. Higher values reduce log noise. Default: 45s."
  manager_interval:
    name: Manager Interval
    description: "Interval for internal cleanup tasks. Default: 3m."
  upstream_base_url:
    name: Upstream Base URL
    description: "For iOS push notifications only. Set to 'https://ntfy.sh' to enable iOS support. Requires base_url."
  admin_username:
    name: Admin Username
    description: "Username for the first admin account. Created automatically on startup. Leave empty to skip."
  admin_password:
    name: Admin Password
    description: "Password for the first admin account."
