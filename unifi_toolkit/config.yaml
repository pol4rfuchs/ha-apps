---
name: "UniFi Toolkit"
version: "0.1.0"
slug: "unifi_toolkit"
description: "UniFi dashboard with Wi-Fi Stalker, Threat Watch, Network Pulse and House Arrest"
url: "https://github.com/pol4rfuchs/ha-apps"
image: "ghcr.io/pol4rfuchs/unifi_toolkit"
arch:
  - aarch64
  - amd64
stage: experimental
init: false
ingress: true
ingress_port: 8000
panel_icon: mdi:access-point-network
panel_title: UniFi Toolkit
watchdog: "http://[HOST]:[PORT:8000]/health"
backup: cold
apparmor: true
options:
  log_level: "INFO"
  stalker_refresh_interval: 60
  webhook_allow_private_ips: true
schema:
  log_level: "list(DEBUG|INFO|WARNING|ERROR)"
  stalker_refresh_interval: "int(10,3600)"
  webhook_allow_private_ips: "bool"
