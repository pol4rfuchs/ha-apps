# prefork MPM — sized for a home server (Raspberry Pi / small NUC)
# The image default (5 servers at start, up to 150) lets Apache start 150 PHP
# processes with memory_limit 512M each, which can push a small host into swap
# or the OOM killer. 30 workers are plenty for a household incl. sync clients.
# MaxConnectionsPerChild recycles processes now and then so PHP memory growth
# does not stay around forever.
StartServers            2
MinSpareServers         2
MaxSpareServers         5
MaxRequestWorkers       30
MaxConnectionsPerChild  500
