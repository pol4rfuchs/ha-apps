---
configuration:
  query_admin_password:
    name: Query-Admin-Passwort
    description: >-
      Passwort für das ServerQuery-Admin-Konto. Leer lassen zur automatischen
      Generierung (nach dem ersten Start in den Logs prüfen).
  log_level:
    name: Log-Level
    description: "Detailgrad des Server-Loggings: 0=Kritisch, 1=Fehler, 2=Warnung, 3=Info, 4=Debug."
  license_accepted:
    name: TeamSpeak-Lizenz akzeptieren
    description: >-
      Du musst die TeamSpeak Server-Lizenz akzeptieren, bevor der Server starten kann.
      Siehe https://teamspeak.com/en/privacy-and-legal/ts-server-license-agreement/

network:
  "9987/udp": Voice-Port (UDP)
  "30033/tcp": Dateitransfer-Port (TCP)
  "10011/tcp": Server-Query-Port (TCP)
  "10022/tcp": SSH-Query-Port (TCP)
  "10080/tcp": HTTP-Web-Query-Port (TCP)
