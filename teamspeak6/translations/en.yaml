---
configuration:
  query_admin_password:
    name: Query Admin Password
    description: >-
      Password of the ServerQuery login "serveradmin" (SSH on port 10022).
      Recommended: set it. It is applied at every start, so you can also add or
      change it later. If empty, TeamSpeak generates one on the first start; it
      is not shown in the log.
  query_ip_allowlist:
    name: Query flood-protection allowlist
    description: >-
      Addresses or networks that TeamSpeak does not lock out for sending too
      many query commands (more than 10 in 3 seconds, ban 10 minutes). Needed
      for other apps that query the server, such as TS6 Manager. Default: the
      Home Assistant app network 172.30.32.0/23. Loopback is always included.
      Entries: IP address or network (IPv4 prefix 16-32, IPv6 prefix 48-128);
      0.0.0.0/0 and other wide networks are refused. Replaces manual edits of
      query_ip_allowlist.txt.
  log_level:
    name: Log Level
    description: >-
      Verbosity of server logging: 0=Critical, 1=Error, 2=Warning, 3=Info,
      4=Debug. It only applies to the server's log files (logs folder and the
      logview command), not to the output in the app log.
  license_accepted:
    name: Accept TeamSpeak License
    description: >-
      You must accept the TeamSpeak Server License before the server can start.
      See https://teamspeak.com/en/privacy-and-legal/ts-server-license-agreement/

network:
  "9987/udp": Voice Port (UDP)
  "30033/tcp": File Transfer Port (TCP)
  "10022/tcp": SSH Query Port (TCP)
  "10080/tcp": HTTP Web Query Port (TCP)
