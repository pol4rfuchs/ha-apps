---
configuration:
  mas_domain:
    name: MAS Domain
    description: "Öffentliche URL der Account-UI (z.B. account.example.org)."
  synapse_server_name:
    name: Synapse Servername
    description: "Muss exakt dem server_name im Synapse-Add-on entsprechen."
  synapse_endpoint:
    name: Synapse Endpoint
    description: "Intern erreichbare URL des Synapse-Add-ons (z.B. http://xxxxx-matrix-server:8008)."
  synapse_secret:
    name: Synapse Shared Secret
    description: "Secret für die Kopplung mit Synapse. Leer lassen zur automatischen Generierung — Wert danach ins Synapse-Add-on übertragen."
  postgres_password:
    name: PostgreSQL-Passwort
    description: "Passwort des internen MAS-Datenbankbenutzers. Leer lassen: es wird eines erzeugt (gespeichert in /data/mas/.pg_password). Ein hier gesetzter Wert wird bei jedem Start in der Datenbank übernommen."
  admin_users:
    name: Admin-User
    description: "Komma-getrennte Liste von Matrix-Usernamen mit Admin-Rechten in MAS."
  password_registration_enabled:
    name: Passwort-Registrierung erlauben
    description: "Erlaubt neue Accounts direkt über MAS per Passwort (ohne Upstream-OIDC-Provider)."
  password_login_enabled:
    name: Passwort-Login erlauben
    description: "Erlaubt Login mit Passwort statt ausschließlich über Upstream-OIDC."
  account_deactivation_allowed:
    name: Account-Deaktivierung erlauben
    description: "Erlaubt Nutzern, ihren eigenen Account über die Account-UI zu deaktivieren."
  log_level:
    name: Log-Level
    description: "Detailgrad der MAS-Protokollierung."
  backup_enabled:
    name: Backup aktivieren
    description: "Aktiviert periodische PostgreSQL-Dumps."
  backup_interval_hours:
    name: Backup-Intervall (Stunden)
    description: "Zeitabstand zwischen automatischen Backups."
  backup_retention_days:
    name: Backup-Aufbewahrung (Tage)
    description: "Wie lange Backups aufbewahrt werden, bevor sie gelöscht werden."
network:
  8082/tcp:
    name: "MAS-Public-API-Port"
    description: "MAS Public API + Account-UI (NPM → hier für HTTPS)."
  8083/tcp:
    name: "MAS-Internal-Port"
    description: "MAS Internal (Health/Metrics, kein NPM)."
