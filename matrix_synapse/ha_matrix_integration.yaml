# ════════════════════════════════════════════════════════════════════════════
# Home Assistant — Matrix notifications
# Add to configuration.yaml (or the packages/ folder)
# ════════════════════════════════════════════════════════════════════════════

notify:
  - platform: matrix
    name: matrix_notify
    homeserver: https://example.org  # ← enter your server
    username: "@homeassistant:example.org"
    password: "your_ha_matrix_password"
    default_room: "#homeassistant:example.org"
    # Define more rooms:
    rooms:
      - "#alarms:example.org"
      - "#presence:example.org"

# ── Example automations ──────────────────────────────────────────────────
automation:
  # Alarm notification
  - alias: "Matrix: Motion alarm"
    trigger:
      - platform: state
        entity_id: binary_sensor.motion_sensor
        to: "on"
    action:
      - service: notify.matrix_notify
        data:
          message: "🚨 Motion detected!"
          target: "#alarms:example.org"

  # Daily summary in the morning
  - alias: "Matrix: Daily summary"
    trigger:
      - platform: time
        at: "07:00:00"
    action:
      - service: notify.matrix_notify
        data:
          message: >
            🏠 **Good morning!**
            🌡️ Living room: {{ states('sensor.living_room_temperature') }}°C
            💡 Lights on: {{ states | selectattr('domain','eq','light') | selectattr('state','eq','on') | list | count }}
            🔒 Doors open: {{ states | selectattr('domain','eq','binary_sensor') | selectattr('attributes.device_class','eq','door') | selectattr('state','eq','on') | list | count }}

  # Receive a Matrix webhook for HA events
  # (Matrix → HA via REST API, no plugin needed)

# ── Matrix as an HA notification target in scripts.yaml ───────────────────
script:
  matrix_alert:
    alias: "Send Matrix alert"
    fields:
      message:
        description: "Message text"
        example: "Alarm triggered!"
      room:
        description: "Target room (optional)"
        example: "#alarms:domain.duckdns.org"
    sequence:
      - service: notify.matrix_notify
        data:
          message: "{{ message }}"
          target: "{{ room | default('#homeassistant:example.org') }}"
