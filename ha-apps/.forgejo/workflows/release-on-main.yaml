name: TS6 Manager Release on main

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'ts6_manager/config.yaml'
      - 'ts6_manager/Dockerfile'
      - 'ts6_manager/CHANGELOG.md'
      - 'scripts/create-codeberg-release.sh'
      - '.forgejo/workflows/release-on-main.yaml'

jobs:
  release:
    runs-on: codeberg-tiny
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release files are present
        shell: bash
        run: |
          set -euo pipefail
          pwd
          test -f scripts/create-codeberg-release.sh || { echo "missing scripts/create-codeberg-release.sh"; exit 1; }
          test -f ts6_manager/config.yaml || { echo "missing ts6_manager/config.yaml"; exit 1; }
          test -f ts6_manager/Dockerfile || { echo "missing ts6_manager/Dockerfile"; exit 1; }
          if [[ -f ts6_manager/build.yaml ]]; then
            echo "WARN: ts6_manager/build.yaml exists but is deprecated; release script will use Dockerfile ARGs."
          fi

      - name: Install tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl git jq

      - name: Create Codeberg release
        env:
          ADDON_DIR: ts6_manager
          CODEBERG_OWNER: Pol4rFuchs
          CODEBERG_REPO: ha-apps
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_BRANCH: main
        run: bash scripts/create-codeberg-release.sh
