name: TS6 Manager Safe Auto-Update Candidate

on:
  schedule:
    - cron: '30 4 * * 1'
  workflow_dispatch:
    inputs:
      target_ts6_manager_ref:
        description: 'Optional explicit upstream ref/SHA for clusterzx/ts6-manager. Empty = latest main commit.'
        required: false
        default: ''
      validate_docker:
        description: 'Docker validation mode: auto, required, or false. Codeberg hosted runners should use auto.'
        required: false
        default: 'auto'

jobs:
  check-and-update:
    runs-on: codeberg-tiny
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify safe-update files are present
        shell: bash
        run: |
          set -euo pipefail
          echo "Repository root: $(pwd)"
          echo "Top-level files:"
          find . -maxdepth 3 -type f | sort | sed 's#^./#  #'

          missing=0
          for file in \
            "scripts/validate-addon.sh" \
            "scripts/update-ts6-manager.sh" \
            "scripts/install-yq-ci.sh" \
            "ts6_manager/Dockerfile" \
            "ts6_manager/config.yaml"; do
            if [[ ! -f "$file" ]]; then
              echo "ERROR: required file is missing: $file" >&2
              missing=1
            else
              echo "OK: $file"
            fi
          done

          if [[ "$missing" -ne 0 ]]; then
            echo "ERROR: Safe update files are incomplete. Copy/commit the files from the files-only ZIP at repo root, not inside a subfolder." >&2
            exit 1
          fi

          chmod +x scripts/validate-addon.sh scripts/update-ts6-manager.sh scripts/install-yq-ci.sh
          if ! grep -q 'TS6 Manager safe updater v8' scripts/update-ts6-manager.sh; then
            echo "ERROR: scripts/update-ts6-manager.sh is still an old version. Expected v8 banner." >&2
            echo "Current updater banner lines:" >&2
            grep -n 'TS6 Manager safe updater' scripts/update-ts6-manager.sh || true
            exit 1
          fi

      - name: Install tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl git jq python3 python3-yaml
          bash ./scripts/install-yq-ci.sh

      - name: Create safe TS6 Manager update candidate
        env:
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
          CODEBERG_REPO: Pol4rFuchs/ha-apps
          BASE_BRANCH: main
          UPDATE_MODE: candidate
          CREATE_RELEASE: 'false'
          CREATE_PR: 'false'
          ADDON_DIR: ts6_manager
          GH_REPO: clusterzx/ts6-manager
          UPSTREAM_BRANCH: main
          TARGET_TS6_MANAGER_REF: ${{ inputs.target_ts6_manager_ref }}
          VALIDATE_DOCKER: ${{ inputs.validate_docker || 'auto' }}
        run: bash ./scripts/update-ts6-manager.sh
