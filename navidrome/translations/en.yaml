---
configuration:
  ND_MUSICFOLDER:
    name: Music folder
    description: >-
      Main path to your music library. Use /media/... for USB/HDD mounts or
      /share/... for SMB shares. Can be mounted read-only.
  ND_EXTRA_MUSIC_FOLDERS:
    name: Extra music folders
    description: >-
      Comma-separated list of additional music folders, e.g. "/media/flac,/share/hires".
      These are mounted as symlinks under ND_MUSICFOLDER, since Navidrome
      only natively supports a single folder.
  ND_DATAFOLDER:
    name: Data folder
    description: >-
      Location for the database and cache.
      Default: /config/addons_config/navidrome
  ND_LOGLEVEL:
    name: Log level
    description: "Log verbosity: error, warn, info, debug, trace."

  ND_ENABLESTARRATING:
    name: Enable Star Ratings
    description: Show 5-star ratings in the UI.
  ND_ENABLEFAVOURITES:
    name: Enable Favourites
    description: Show the heart/loved toggle for songs, albums, and artists.
  ND_ENABLEDOWNLOADS:
    name: Enable Downloads
    description: Allow downloading tracks and albums from the UI.
  ND_ENABLESHARING:
    name: Enable Sharing
    description: Allow public share links for tracks and playlists.
  ND_ENABLEGRAVATAR:
    name: Enable Gravatar
    description: Use Gravatar as the profile picture (requires an email on the user account).
  ND_MAXSIDEBARPLAYLISTS:
    name: Max Sidebar Playlists
    description: Maximum number of playlists shown in the sidebar.

  ND_SCANNER_SCHEDULE:
    name: Scan Schedule
    description: >-
      Cron or interval expression for automatic library scans.
      Examples: "@every 24h", "0 2 * * *", "0" = disabled.
  ND_AUTOIMPORTPLAYLISTS:
    name: Auto-import Playlists
    description: Automatically read .m3u/.m3u8 playlist files found in the music folder.
  ND_IGNOREDARTICLES:
    name: Ignored Articles
    description: Space-separated list of articles ignored when sorting.
  ND_INDEXGROUPS:
    name: Index Groups
    description: Defines the A-Z groups in the browser view.
  ND_COVERARTPRIORITY:
    name: Cover Art Priority
    description: Comma-separated priority list of cover art sources.
  ND_IMAGECACHESIZE:
    name: Image Cache Size
    description: Size of the cover art cache. "0" = disabled.

  ND_SCANNER_EXTRACTOR:
    name: Metadata Extractor
    description: >-
      "taglib" (default, fast) or "ffmpeg" (supports more formats, e.g.
      Opus, AAC in MP4). Requires ffmpeg to be installed when set to "ffmpeg".
  ND_TRANSCODINGCACHESIZE:
    name: Transcoding Cache Size
    description: Size of the transcoding cache. "0" = disabled.
  ND_DEFAULTDOWNSAMPLINGFORMAT:
    name: Default Downsampling Format
    description: "Audio format for Subsonic clients requesting downsampling: mp3, opus, aac, ogg."

  ND_PODCAST_EPISODEKEEPCOUNT:
    name: Podcast Episodes to Keep
    description: >-
      Number of episodes kept per podcast (0 = unlimited).
      Older episodes are deleted automatically.
  ND_PODCAST_EPISODEDOWNLOADCOUNT:
    name: Podcast Episodes to Pre-download
    description: >-
      Number of newest episodes downloaded immediately upon subscribing
      (0 = no automatic downloads).

  ND_SESSIONTIMEOUT:
    name: Session Timeout
    description: Inactive browser sessions are closed after this duration (e.g. "30m", "2h").
  ND_LASTFM_ENABLED:
    name: Enable Last.fm
    description: Enable Last.fm scrobbling and metadata.
  ND_LASTFM_LANGUAGE:
    name: Last.fm Language
    description: Two-letter ISO language code for Last.fm metadata (e.g. "de", "en").
  ND_LISTENBRAINZ_ENABLED:
    name: Enable ListenBrainz
    description: Enable ListenBrainz scrobbling.

  ND_JUKEBOX_ENABLED:
    name: Enable Jukebox
    description: >-
      Play audio directly on the server hardware (e.g. speakers attached to
      a Raspberry Pi). Requires an ALSA device and privileged mode.
  ND_DEFAULTPLAYLISTPUBLICVISIBILITY:
    name: Playlists Public by Default
    description: Set newly imported playlists to public by default.
  ND_SMARTPLAYLISTREFRESHDELAY:
    name: Smart Playlist Refresh Delay
    description: How often smart playlists are refreshed (e.g. "5s", "1m").

  ND_ENABLEINSIGHTSCOLLECTOR:
    name: Anonymous Usage Statistics
    description: Send anonymous usage statistics to the Navidrome project. Disabled by default.
