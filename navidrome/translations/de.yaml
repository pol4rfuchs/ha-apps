---
configuration:
  ND_MUSICFOLDER:
    name: Music folder
    description: >-
      Hauptpfad zur Musikbibliothek. Nutze /media/... für USB/HDD-Mounts oder
      /share/... für SMB-Freigaben. Kann read-only gemountet sein.
  ND_EXTRA_MUSIC_FOLDERS:
    name: Extra music folders
    description: >-
      Kommagetrennte Liste zusätzlicher Musikordner, z.B. "/media/flac,/share/hires".
      Diese werden als Symlinks unter ND_MUSICFOLDER eingehängt, da Navidrome
      nativ nur einen Ordner unterstützt.
  ND_DATAFOLDER:
    name: Data folder
    description: >-
      Speicherort für Datenbank und Cache.
      Standard: /config/addons_config/navidrome
  ND_LOGLEVEL:
    name: Log level
    description: "Detailgrad der Logs: error, warn, info, debug, trace."

  ND_ENABLESTARRATING:
    name: Sternebewertungen aktivieren
    description: 5-Sterne-Bewertungen in der UI anzeigen.
  ND_ENABLEFAVOURITES:
    name: Favoriten aktivieren
    description: Herz/Loved-Toggle für Songs, Alben und Künstler anzeigen.
  ND_ENABLEDOWNLOADS:
    name: Downloads aktivieren
    description: Download von Tracks und Alben aus der UI erlauben.
  ND_ENABLESHARING:
    name: Teilen aktivieren
    description: Öffentliche Share-Links für Tracks und Playlists erlauben.
  ND_ENABLEGRAVATAR:
    name: Gravatar aktivieren
    description: Gravatar als Profilbild nutzen (benötigt E-Mail beim User).
  ND_MAXSIDEBARPLAYLISTS:
    name: Max. Playlists in Sidebar
    description: Maximale Anzahl Playlists in der Seitenleiste.

  ND_SCANNER_SCHEDULE:
    name: Scan-Zeitplan
    description: >-
      Cron- oder Intervall-Ausdruck für automatische Bibliotheks-Scans.
      Beispiele: "@every 24h", "0 2 * * *", "0" = deaktiviert.
  ND_AUTOIMPORTPLAYLISTS:
    name: Playlists automatisch importieren
    description: .m3u/.m3u8 Playlist-Dateien im Musikordner automatisch einlesen.
  ND_IGNOREDARTICLES:
    name: Ignorierte Artikel
    description: Leerzeichen-getrennte Liste von Artikeln die beim Sortieren ignoriert werden.
  ND_INDEXGROUPS:
    name: Index-Gruppen
    description: Definiert die A-Z Gruppen in der Browser-Ansicht.
  ND_COVERARTPRIORITY:
    name: Cover-Art Priorität
    description: Kommagetrennte Prioritätsliste der Cover-Quellen.
  ND_IMAGECACHESIZE:
    name: Bild-Cache-Größe
    description: Größe des Cover-Art Caches. "0" = deaktiviert.

  ND_SCANNER_EXTRACTOR:
    name: Metadaten-Extraktor
    description: >-
      "taglib" (Standard, schnell) oder "ffmpeg" (unterstützt mehr Formate,
      z.B. Opus, AAC in MP4). Benötigt ffmpeg installiert wenn "ffmpeg" gewählt.
  ND_TRANSCODINGCACHESIZE:
    name: Transcoding-Cache-Größe
    description: Größe des Transcoding-Caches. "0" = deaktiviert.
  ND_DEFAULTDOWNSAMPLINGFORMAT:
    name: Standard-Downsampling-Format
    description: "Audio-Format für Subsonic-Clients die Downsampling anfragen: mp3, opus, aac, ogg."

  ND_PODCAST_EPISODEKEEPCOUNT:
    name: Podcast-Episoden behalten
    description: >-
      Anzahl der Episoden die pro Podcast behalten werden (0 = unbegrenzt).
      Ältere Episoden werden automatisch gelöscht.
  ND_PODCAST_EPISODEDOWNLOADCOUNT:
    name: Podcast-Episoden vorab laden
    description: >-
      Anzahl der neuesten Episoden die beim Abonnieren sofort heruntergeladen
      werden (0 = keine automatischen Downloads).

  ND_SESSIONTIMEOUT:
    name: Session-Timeout
    description: Inaktive Browser-Sessions werden nach dieser Zeit geschlossen (z.B. "30m", "2h").
  ND_LASTFM_ENABLED:
    name: Last.fm aktivieren
    description: Last.fm Scrobbling und Metadaten aktivieren.
  ND_LASTFM_LANGUAGE:
    name: Last.fm Sprache
    description: Zweistelliger ISO-Sprachcode für Last.fm Metadaten (z.B. "de", "en").
  ND_LISTENBRAINZ_ENABLED:
    name: ListenBrainz aktivieren
    description: ListenBrainz Scrobbling aktivieren.

  ND_JUKEBOX_ENABLED:
    name: Jukebox aktivieren
    description: >-
      Audio direkt auf der Server-Hardware abspielen (z.B. am Raspberry Pi
      angeschlossene Lautsprecher). Benötigt ALSA-Gerät und privileged-Modus.
  ND_DEFAULTPLAYLISTPUBLICVISIBILITY:
    name: Playlists standardmäßig öffentlich
    description: Neu importierte Playlists standardmäßig als öffentlich setzen.
  ND_SMARTPLAYLISTREFRESHDELAY:
    name: Smart-Playlist Aktualisierungsintervall
    description: Wie oft Smart Playlists aktualisiert werden (z.B. "5s", "1m").

  ND_ENABLEINSIGHTSCOLLECTOR:
    name: Anonyme Nutzungsstatistiken
    description: Anonyme Statistiken an das Navidrome-Projekt senden. Standard deaktiviert.
