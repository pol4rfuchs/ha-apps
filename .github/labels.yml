# Source of truth for GitHub labels — synced by 15-labels.yml
# ── Type ────────────────────────────────────────────────────────────────────────
- name: "bug"
  color: "d73a4a"
  description: "Something is not working"
- name: "enhancement"
  color: "a2eeef"
  description: "New feature or improvement"
- name: "documentation"
  color: "0075ca"
  description: "Improvements or additions to the documentation"
- name: "question"
  color: "d876e3"
  description: "More information needed"
- name: "refactor"
  color: "e4e669"
  description: "Code restructuring without a functional change"
# ── Status ─────────────────────────────────────────────────────────────────────
- name: "duplicate"
  color: "cfd3d7"
  description: "Issue or PR already exists"
- name: "invalid"
  color: "e4e669"
  description: "Not a valid issue"
- name: "wontfix"
  color: "ffffff"
  description: "Will not be worked on"
- name: "stale"
  color: "ededed"
  description: "No activity for a longer time"
- name: "blocked"
  color: "b60205"
  description: "Blocked by an external problem"
