name: "📦 Dependency / Security Report"
description: Manually report a dependency or security topic that Renovate or Dependabot does not already pick up automatically.
title: "[dependency] "
labels:
  - dependencies
body:
  - type: markdown
    attributes:
      value: |
        For automatically detected security alerts, `27-dependabot-alerts-to-issues.yml` already creates issues.
        This form is for anything you discovered yourself (e.g. during a manual review, a Pi test, or an upstream changelog).

  - type: dropdown
    id: addon
    attributes:
      label: Affected app
      description: Which add-on in the monorepo is affected?
      options:
        - forgejo
        - intiface_central
        - matrix_auth_service
        - matrix_ketesa
        - matrix_signal_bridge
        - matrix_synapse
        - matrix_telegram_bridge
        - matrix_whatsapp_bridge
        - navidrome
        - nextcloud
        - nginx_proxy_manager
        - ntfy
        - ntfy_manager
        - restic_backup
        - searxng
        - teamspeak6
        - ts6_manager
        - unbound
        - unifi_toolkit
        - unifi_os_control_center
        - vaultwarden
        - cortendesk
        - Repo-wide / tooling (not app-specific)
    validations:
      required: true

  - type: dropdown
    id: kind
    attributes:
      label: Type of topic
      options:
        - Security vulnerability / CVE
        - Outdated version
        - Breaking change in a planned update
        - Renovate/Dependabot does not cover this (gap in the config)
        - Other
    validations:
      required: true

  - type: input
    id: package
    attributes:
      label: Affected package / base image
      placeholder: "e.g. nlnetlabs/unbound, node, matrix-synapse"
    validations:
      required: true

  - type: input
    id: versions
    attributes:
      label: Current version -> target version
      placeholder: "e.g. 1.25.1 -> 1.26.0"
    validations:
      required: false

  - type: textarea
    id: details
    attributes:
      label: Details
      description: What is the problem, where did you see it (advisory link, changelog, Pi test), what should happen?
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-check
      options:
        - label: I checked that Renovate does not currently open a PR for this (renovate.json / Dependency Dashboard)
          required: false
        - label: I checked that there is no open issue for this yet
          required: true
