name: 12 Dockerfile Lint

on:
  pull_request:
    branches:
      - main
    paths:
      - "*/Dockerfile"
      - ".github/workflows/12-dockerfile-lint.yml"
  push:
    branches:
      - main
    paths:
      - "*/Dockerfile"
      - ".github/workflows/12-dockerfile-lint.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    name: Read add-on list
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.addons.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Load addons.json
        id: addons
        run: |
          {
            echo 'matrix<<EOF'
            python3 -c "import json; print(json.dumps(json.load(open('addons.json'))))"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
          
  hadolint:
    name: Hadolint ${{ matrix.app }}
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Run Hadolint
        if: ${{ hashFiles(format('{0}/Dockerfile', matrix.app)) != '' }}
        uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5 # v3.3.0
        with:
          dockerfile: ${{ matrix.app }}/Dockerfile
          failure-threshold: error
          no-fail: false
