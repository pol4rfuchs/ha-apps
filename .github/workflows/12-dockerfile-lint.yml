name: 12 Dockerfile Lint

on:
  pull_request:
    branches:
      - main
    paths:
      - "*/Dockerfile"
      - ".github/workflows/12-dockerfile-lint.yml"
  push:
    branches:
      - main
    paths:
      - "*/Dockerfile"
      - ".github/workflows/12-dockerfile-lint.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    name: Read add-on list
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.addons.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Load addons.json
        id: addons
        run: |
          {
            echo 'matrix<<EOF'
            python3 -c "import json; print(json.dumps(json.load(open('addons.json'))))"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
          
  hadolint:
    name: Hadolint ${{ matrix.app }}
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Hadolint
        if: ${{ hashFiles(format('{0}/Dockerfile', matrix.app)) != '' }}
        uses: hadolint/hadolint-action@2a66e89f53d0771bb131a7fa31f3136336094aa6 # v3.4.0
        with:
          dockerfile: ${{ matrix.app }}/Dockerfile
          failure-threshold: error
          no-fail: false
          ignore: DL3008,DL3013,DL3018
