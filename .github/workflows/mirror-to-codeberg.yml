---
name: Mirror to Codeberg

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mirror-to-codeberg
  cancel-in-progress: false

jobs:
  mirror:
    name: Push mirror to Codeberg
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Push mirror to Codeberg
        shell: bash
        env:
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_MIRROR_TOKEN }}
        run: |
          set -euo pipefail
          git remote add codeberg \
            "https://Pol4rFuchs:${CODEBERG_TOKEN}@codeberg.org/Pol4rFuchs/ha-apps.git"

          max_attempts=5
          attempt=1
          delay=15

          while (( attempt <= max_attempts )); do
            echo "Push attempt ${attempt}/${max_attempts}..."

            if git push --force codeberg refs/heads/main:refs/heads/main 2> push_error.log; then
              echo "Mirrored to codeberg.org/Pol4rFuchs/ha-apps"
              exit 0
            fi

            cat push_error.log

            if grep -q "cannot lock ref" push_error.log; then
              echo "Stale ref lock on Codeberg's side detected. Retrying in ${delay}s..."
              sleep "${delay}"
              delay=$(( delay * 2 ))
              attempt=$(( attempt + 1 ))
            else
              echo "Non-lock error encountered, failing immediately."
              exit 1
            fi
          done

          echo "::error::Mirror push failed after ${max_attempts} attempts due to a persistent ref lock on Codeberg's side. This is a known Codeberg/Forgejo infrastructure issue (stale lock files on their Ceph storage, see https://codeberg.org/forgejo/forgejo/issues/1946). File an issue at https://codeberg.org/Codeberg/Community with the repo path 'pol4rfuchs/ha-apps.git' so an admin can clear the lock manually."
          exit 1
