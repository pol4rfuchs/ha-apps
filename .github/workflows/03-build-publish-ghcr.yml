---
name: 03 Build Publish GHCR

on:
  push:
    tags:
      - '*-v*'
    branches:
      - main
  workflow_dispatch:
    inputs:
      app:
        description: "Specific add-on folder to publish, or all"
        required: false
        default: "all"

permissions:
  contents: read

concurrency:
  group: build-publish-ghcr-${{ github.ref }}-${{ github.event.inputs.app || github.event_name }}
  cancel-in-progress: false

jobs:
  detect:
    name: Detect add-ons
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.detect.outputs.apps }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Build publish matrix
        id: detect
        shell: bash
        env:
          DISPATCH_APP: ${{ inputs.app || '' }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          expected = json.load(open("addons.json", encoding="utf-8"))
          wanted = os.environ.get("DISPATCH_APP", "")
          ref_type = os.environ.get("REF_TYPE", "")
          ref_name = os.environ.get("REF_NAME", "")
          event_name = os.environ.get("EVENT_NAME", "")
          before_sha = os.environ.get("BEFORE_SHA", "")
          after_sha = os.environ.get("AFTER_SHA", "")

          selected = []
          # Version straight from the tag, e.g. "1.1.14" out of "teamspeak6-v1.1.14".
          # This is the release-please manifest value at the moment the tag was
          # cut and is always correct — unlike config.yaml, which can still be
          # mid-drift (sync-versions job hasn't landed its commit yet) when this
          # workflow fires off the tag push. See build-app.yaml prepare step.
          tag_version = ""
          if wanted and wanted != "all":
              selected = [wanted]
          elif wanted == "all":
              selected = expected
          elif ref_type == "tag":
              # Release Please tag format from release-please-config.json:
              # <addon>-v<version>, e.g. ntfy-v1.1.8
              match = re.match(r"^(.+)-v([^/]+)$", ref_name)
              if not match:
                  raise SystemExit(f"unsupported release tag format: {ref_name}")
              selected = [match.group(1)]
              tag_version = match.group(2)
          elif event_name == "push" and ref_type == "branch":
              # Plain push to main (no tag). Only relevant for add-ons that are
              # NOT managed by Release Please (see release-please-config.json) —
              # those never get a *-v* tag, so this is their only automatic path.
              # Release-Please-managed add-ons are ignored here even if their
              # folder changed; they already get built via their own tag push,
              # and building them again here would be redundant/racy.
              rp_config = json.load(open("release-please-config.json", encoding="utf-8"))
              rp_managed = set(rp_config.get("packages", {}).keys())
              manual_versioned = [a for a in expected if a not in rp_managed]

              changed_files = []
              if before_sha and set(before_sha) != {"0"}:
                  diff = subprocess.run(
                      ["git", "diff", "--name-only", before_sha, after_sha],
                      capture_output=True, text=True, check=True,
                  )
                  changed_files = diff.stdout.splitlines()
              else:
                  # No usable before-SHA (e.g. first push on a new branch) —
                  # be conservative and build nothing rather than guess.
                  changed_files = []

              changed_top_dirs = {f.split("/", 1)[0] for f in changed_files}
              selected = [a for a in manual_versioned if a in changed_top_dirs]
          else:
              selected = []

          bad = sorted(set(selected) - set(expected))
          if bad:
              raise SystemExit(f"unknown add-on(s): {bad}; expected one of {expected}")

          rows = []
          for app in expected:
              if app not in selected:
                  continue
              if Path(app, "Dockerfile").is_file() and Path(app, "config.yaml").is_file():
                  row = {"app": app}
                  if tag_version:
                      row["version"] = tag_version
                  rows.append(row)
          print("apps=" + json.dumps(rows))
          PY

  publish:
    name: Publish ${{ matrix.app }}
    needs: detect
    if: needs.detect.outputs.apps != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.detect.outputs.apps) }}
    uses: ./.github/workflows/build-app.yaml
    permissions:
      contents: read
      packages: write
    with:
      app: ${{ matrix.app }}
      publish: true
      version_override: ${{ matrix.version || '' }}
