---
# Stale Issues/PRs automatisch schließen nach 60/14 Tagen Inaktivität
name: 16 Stale

# yamllint disable-line rule:truthy
on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: stale
  cancel-in-progress: true

jobs:
  stale:
    uses: hassio-addons/workflows/.github/workflows/stale.yaml@c953d10f34dac22eb68c1cdedbbc4106a89bef88 # v3.0.1
