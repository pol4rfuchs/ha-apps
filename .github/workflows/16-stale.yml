---
# Stale Issues/PRs automatisch schließen nach 60/14 Tagen Inaktivität
name: 16 Stale

# yamllint disable-line rule:truthy
on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: stale
  cancel-in-progress: true

jobs:
  stale:
    uses: hassio-addons/workflows/.github/workflows/stale.yaml@e0c532a7b0fb264b3ff0c718c2c0308a0c8c1390 # v4.0.0
