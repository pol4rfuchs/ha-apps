---
# Syncs the labels from .github/labels.yml (daily + on change + manually).
# prune: false is mandatory: Release Please manages "autorelease: pending/tagged"
# itself. If the sync deleted these labels, Release Please would no longer find
# the release PR on merge and would not create the tag + GHCR image.
name: 15 Sync Labels

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - main
    paths:
      - ".github/labels.yml"
      - ".github/workflows/15-labels.yml"
  schedule:
    - cron: "34 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: labels-${{ github.ref }}
  cancel-in-progress: true

jobs:
  labels:
    name: Sync labels
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Label Syncer
        uses: micnncim/action-label-syncer@3abd5ab72fda571e69fffd97bd4e0033dd5f495c # v1.3.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          manifest: .github/labels.yml
          prune: false
