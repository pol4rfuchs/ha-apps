name: Add-on Validation

on:
  push:
    branches:
      - main
      - "auto/**"
    paths:
      - "intiface_central/**"
      - "matrix_synapse/**"
      - "navidrome/**"
      - "nginx_proxy_manager/**"
      - "ntfy/**"
      - "ntfy_manager/**"
      - "searxng/**"
      - "teamspeak6/**"
      - "ts6_manager/**"
      - ".github/workflows/validate-addon.yaml"
  pull_request:
    branches:
      - main
    paths:
      - "intiface_central/**"
      - "matrix_synapse/**"
      - "navidrome/**"
      - "nginx_proxy_manager/**"
      - "ntfy/**"
      - "ntfy_manager/**"
      - "searxng/**"
      - "teamspeak6/**"
      - "ts6_manager/**"
      - ".github/workflows/validate-addon.yaml"
  workflow_dispatch:
    inputs:
      addon:
        description: "Add-on dir to validate, or all."
        required: false
        default: "all"
      validate_docker:
        description: "Docker validation mode: auto, required, or false."
        required: false
        default: "auto"

permissions:
  contents: read

concurrency:
  group: addon-validation-${{ github.ref }}-${{ github.event.inputs.addon || 'auto' }}
  cancel-in-progress: true

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect add-ons
        id: detect
        shell: bash
        env:
          MANUAL_ADDON: ${{ github.event.inputs.addon || '' }}
        run: |
          set -euo pipefail

          addons=(
            "intiface_central"
            "matrix_synapse"
            "navidrome"
            "nginx_proxy_manager"
            "ntfy"
            "ntfy_manager"
            "searxng"
            "teamspeak6"
            "ts6_manager"
          )

          if [[ -n "${MANUAL_ADDON}" && "${MANUAL_ADDON}" != "all" ]]; then
            addons=("${MANUAL_ADDON}")
          fi

          python3 - <<'PY' "${addons[@]}" >> "$GITHUB_OUTPUT"
          import json
          import sys
          from pathlib import Path

          matrix = []
          for addon in sys.argv[1:]:
              if Path(addon, "config.yaml").is_file() and Path(addon, "Dockerfile").is_file():
                  matrix.append({"addon": addon})

          print("matrix=" + json.dumps(matrix, separators=(",", ":")))
          PY

  validate:
    needs: detect
    if: ${{ needs.detect.outputs.matrix != '[]' }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.detect.outputs.matrix) }}

    env:
      ADDON_DIR: ${{ matrix.addon }}
      VALIDATE_DOCKER: ${{ github.event.inputs.validate_docker || 'auto' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install validation tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ca-certificates python3 python3-yaml

      - name: Static validate add-on metadata and layout
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          import re
          import sys
          from pathlib import Path
          import yaml

          addon = os.environ["ADDON_DIR"]
          expected_images = {
              "intiface_central": "ghcr.io/pol4rfuchs/intiface-ha-app",
              "matrix_synapse": "ghcr.io/pol4rfuchs/matrix-synapse-ha-app",
              "navidrome": "ghcr.io/pol4rfuchs/navidrome-ha-app",
              "nginx_proxy_manager": "ghcr.io/pol4rfuchs/npm-ha-app",
              "ntfy": "ghcr.io/pol4rfuchs/ntfy-ha-app",
              "ntfy_manager": "ghcr.io/pol4rfuchs/ntfy-manager-ha-app",
              "searxng": "ghcr.io/pol4rfuchs/searxng-ha-app",
              "teamspeak6": "ghcr.io/pol4rfuchs/teamspeak6-ha-app",
              "ts6_manager": "ghcr.io/pol4rfuchs/teamspeak6-manager-ha-app",
          }

          def fail(message: str) -> None:
              print(f"ERROR: {addon}: {message}", file=sys.stderr)
              raise SystemExit(1)

          root = Path(addon)
          config_path = root / "config.yaml"
          dockerfile_path = root / "Dockerfile"

          if not config_path.is_file():
              fail("missing config.yaml")
          if not dockerfile_path.is_file():
              fail("missing Dockerfile")
          if (root / "build.yaml").exists():
              fail("build.yaml is deprecated and must not exist")
          if (root / "repository.yaml").exists():
              fail("repository.yaml must not live inside an add-on directory")
          if (root / "rootfs" / "etc" / "services.d").exists():
              fail("old s6 services.d layout is present; use s6-overlay/s6-rc.d")

          with config_path.open("r", encoding="utf-8") as handle:
              config = yaml.safe_load(handle) or {}

          for key in ("name", "version", "slug", "url", "image", "arch"):
              if key not in config:
                  fail(f"config.yaml missing required key: {key}")

          version = str(config["version"]).strip()
          if not re.fullmatch(r"[0-9]+(\.[0-9]+){1,3}([-.][0-9A-Za-z]+)?", version):
              fail(f"version has unexpected format: {version!r}")

          image = str(config["image"]).strip()
          expected_image = expected_images.get(addon)
          if expected_image and image != expected_image:
              fail(f"image must be {expected_image!r}, got {image!r}")

          url = str(config["url"]).strip()
          if url != "https://github.com/pol4rfuchs/ha-apps":
              fail(f"url must be GitHub repo URL, got {url!r}")

          arch = config["arch"]
          if not isinstance(arch, list) or not arch:
              fail("arch must be a non-empty list")
          invalid_arch = sorted(set(arch) - {"amd64", "aarch64"})
          if invalid_arch:
              fail(f"unsupported arch values: {invalid_arch}")

          text = dockerfile_path.read_text(encoding="utf-8")
          if not re.search(r"(?m)^FROM\s+\S+", text):
              fail("Dockerfile has no FROM instruction")
          if "codeberg.org" in text.lower() or "forgejo" in text.lower():
              fail("Dockerfile still references Codeberg/Forgejo")

          print(f"OK: {addon} v{version} -> {image} ({', '.join(arch)})")
          PY

      - name: Docker build smoke test
        if: ${{ env.VALIDATE_DOCKER != 'false' && env.VALIDATE_DOCKER != '0' && env.VALIDATE_DOCKER != 'no' }}
        shell: bash
        run: |
          set -euo pipefail

          if ! command -v docker >/dev/null 2>&1 || ! docker info >/dev/null 2>&1; then
            if [[ "${VALIDATE_DOCKER}" == "auto" ]]; then
              echo "WARN: Docker is unavailable; skipping Docker smoke build because VALIDATE_DOCKER=auto."
              exit 0
            fi
            echo "ERROR: Docker is required because VALIDATE_DOCKER=${VALIDATE_DOCKER}." >&2
            exit 1
          fi

          version="$(python3 - <<'PY'
          import os
          import yaml
          from pathlib import Path
          data = yaml.safe_load(Path(os.environ["ADDON_DIR"], "config.yaml").read_text(encoding="utf-8")) or {}
          print(data.get("version", "dev"))
          PY
          )"

          docker build \
            --pull \
            --build-arg "BUILD_VERSION=${version}" \
            --build-arg "BUILD_ARCH=amd64" \
            -t "ha-apps-${ADDON_DIR}:validation-${GITHUB_SHA::12}" \
            "${ADDON_DIR}"
