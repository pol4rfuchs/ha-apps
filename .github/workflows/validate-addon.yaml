name: TS6 Manager Add-on Validation

on:
  push:
    branches:
      - main
      - "auto/ts6-manager-*"
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      validate_docker:
        description: "Docker validation mode: auto, required, or false."
        required: false
        default: "auto"

permissions:
  contents: read

concurrency:
  group: ts6-manager-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest

    env:
      ADDON_DIR: ts6_manager
      VALIDATE_DOCKER: ${{ inputs.validate_docker || 'auto' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify required files are present
        shell: bash
        run: |
          set -euo pipefail

          echo "Repository root: $(pwd)"

          missing=0
          for file in \
            "scripts/validate-addon.sh" \
            "scripts/install-yq-ci.sh" \
            "ts6_manager/Dockerfile" \
            "ts6_manager/config.yaml"; do
            if [[ ! -f "$file" ]]; then
              echo "ERROR: required file is missing: $file" >&2
              missing=1
            else
              echo "OK: $file"
            fi
          done

          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi

          chmod +x scripts/validate-addon.sh scripts/install-yq-ci.sh

      - name: Install validation tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl git jq python3 python3-yaml
          bash ./scripts/install-yq-ci.sh

      - name: Validate add-on
        shell: bash
        run: bash ./scripts/validate-addon.sh
