name: "24 - Unbound Renovate Merge Reminder"

# Unbound is decoupled from Release Please (manual versioning: <upstream>-haNN-pol4rN).
# Renovate opens a PR when NLnetLabs/unbound has a new upstream release; merging it only
# bumps the version pointer. Workflow 25 then prepares the bump PR. This workflow is the
# fallback for the case that 25 fails (for example its patch step finds a changed file
# structure): it opens a reminder issue so the bump is not forgotten. It does not run when
# 25 succeeded, so a normal bump no longer produces both an issue and a PR.

on:
  workflow_run:
    workflows: ["25 - Unbound Auto-Bump PR"]
    types: [completed]

permissions:
  issues: write

jobs:
  remind:
    if: >
      github.event.workflow_run.conclusion == 'failure' &&
      startsWith(github.event.workflow_run.head_branch, 'renovate/nlnetlabs-unbound')
    runs-on: ubuntu-24.04
    steps:
      - name: Extract new upstream version from PR title
        id: version
        env:
          # For runs started by a pull_request event this is the pull request title.
          PR_TITLE: ${{ github.event.workflow_run.display_title }}
        run: |
          # Expected title format: "chore(unbound): update dependency nlnetlabs/unbound to v1.26.0"
          NEW_VERSION=$(echo "$PR_TITLE" | grep -oP 'v?\K[0-9]+\.[0-9]+\.[0-9]+$' || echo "unknown")
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Create reminder issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          NEW_VERSION: ${{ steps.version.outputs.new_version }}
        with:
          script: |
            const newVersion = process.env.NEW_VERSION;
            const runUrl = context.payload.workflow_run.html_url;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `unbound: manual build/release needed for upstream ${newVersion}`,
              labels: ["unbound", "manual-action-needed"],
              body: [
                `A Renovate PR bumped the NLnetLabs/unbound dependency pointer to **${newVersion}**, but the auto-bump workflow failed: ${runUrl}`,
                ``,
                `Since unbound is decoupled from Release Please, nothing was prepared for you. Manual steps:`,
                ``,
                `- [ ] Adjust the source-build tarball reference to ${newVersion}`,
                `- [ ] Bump the ha-tag (e.g. \`${newVersion}-ha1-pol4r1\`)`,
                `- [ ] Trigger build/release manually`,
                `- [ ] Verify on Pi (DNS resolving, ECS toggle, no crash-loop)`,
                ``,
                `_Auto-created by 24-unbound-renovate-reminder.yml (fallback for a failed 25)_`
              ].join("\n")
            });
