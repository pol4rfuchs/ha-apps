name: 06 Update Upstream Candidate

on:
  schedule:
    - cron: "30 4 * * 1"
  workflow_dispatch:
    inputs:
      addon:
        description: "Add-on dir to update, or all."
        required: false
        default: "all"
      target_version:
        description: "Optional explicit version/tag for version-based add-ons. Empty = latest upstream."
        required: false
        default: ""
      target_ref:
        description: "Optional explicit commit SHA for ref-based add-ons. Empty = latest upstream branch commit."
        required: false
        default: ""
      validate_docker:
        description: "Docker validation mode: auto, required, or false."
        required: false
        default: "auto"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: addon-safe-auto-update-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - addon: ts6_manager
            mode: github_branch_ref
            upstream_repo: clusterzx/ts6-manager
            upstream_branch: main
            arg_name: TS6_MANAGER_REF
            tag_prefix: ts6-manager
          - addon: ntfy
            mode: github_latest_release_arg
            upstream_repo: binwiederhier/ntfy
            arg_name: NTFY_VERSION
            tag_prefix: ntfy
          - addon: navidrome
            mode: dockerhub_from_tag
            dockerhub_repo: deluan/navidrome
            image_prefix: deluan/navidrome
            tag_prefix: navidrome
          - addon: nginx_proxy_manager
            mode: dockerhub_from_tag
            dockerhub_repo: jc21/nginx-proxy-manager
            image_prefix: jc21/nginx-proxy-manager
            tag_prefix: nginx-proxy-manager
          - addon: teamspeak6
            mode: dockerhub_arg_tag
            dockerhub_repo: teamspeaksystems/teamspeak6-server
            arg_name: TEAMSPEAK_VERSION
            image_prefix: teamspeaksystems/teamspeak6-server
            tag_prefix: teamspeak6
          - addon: intiface_central
            mode: noop
            tag_prefix: intiface-central
            reason: "Dockerfile uses Cargo crate version ARG ENGINE_VERSION; no reliable GitHub release source is declared in-repo."
          - addon: matrix_synapse
            mode: noop
            tag_prefix: matrix-synapse
            reason: "Dockerfile has no upstream version ARG/FROM tag suitable for a safe automatic bump."
          - addon: ntfy_manager
            mode: noop
            tag_prefix: ntfy-manager
            reason: "Internal app add-on; no external upstream version/ref is declared in-repo."
          - addon: searxng
            mode: dockerhub_from_tag
            dockerhub_repo: searxng/searxng
            image_prefix: searxng/searxng
            tag_prefix: searxng

    env:
      BASE_BRANCH: main
      MANUAL_ADDON: ${{ github.event.inputs.addon || 'all' }}
      TARGET_VERSION: ${{ github.event.inputs.target_version || '' }}
      TARGET_REF: ${{ github.event.inputs.target_ref || '' }}
      VALIDATE_DOCKER: ${{ github.event.inputs.validate_docker || 'auto' }}

    steps:
      - name: Skip non-selected add-on
        if: ${{ env.MANUAL_ADDON != 'all' && env.MANUAL_ADDON != matrix.addon }}
        run: |
          echo "Skipping ${{ matrix.addon }} because selected add-on is ${MANUAL_ADDON}."

      - name: Checkout repository
        if: ${{ env.MANUAL_ADDON == 'all' || env.MANUAL_ADDON == matrix.addon }}
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install tools
        if: ${{ env.MANUAL_ADDON == 'all' || env.MANUAL_ADDON == matrix.addon }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl git jq python3 python3-yaml

      - name: Explain no-op add-on
        if: ${{ (env.MANUAL_ADDON == 'all' || env.MANUAL_ADDON == matrix.addon) && matrix.mode == 'noop' }}
        run: |
          echo "No safe auto-update rule for ${{ matrix.addon }}."
          echo "${{ matrix.reason }}"

      - name: Resolve target
        id: target
        if: ${{ (env.MANUAL_ADDON == 'all' || env.MANUAL_ADDON == matrix.addon) && matrix.mode != 'noop' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          mode="${{ matrix.mode }}"

          if [[ "${mode}" == "github_branch_ref" ]]; then
            if [[ -n "${TARGET_REF}" ]]; then
              value="${TARGET_REF}"
            else
              value="$(git ls-remote "https://github.com/${{ matrix.upstream_repo }}.git" "refs/heads/${{ matrix.upstream_branch }}" | awk '{print $1}')"
            fi
            [[ -n "${value}" ]] || { echo "ERROR: could not resolve upstream ref" >&2; exit 1; }
          elif [[ "${mode}" == "github_latest_release_arg" ]]; then
            if [[ -n "${TARGET_VERSION}" ]]; then
              value="${TARGET_VERSION}"
            else
              value="$(gh api "repos/${{ matrix.upstream_repo }}/releases/latest" --jq '.tag_name' | sed 's/^v//')"
            fi
            [[ -n "${value}" ]] || { echo "ERROR: could not resolve latest GitHub release" >&2; exit 1; }
          elif [[ "${mode}" == "dockerhub_from_tag" || "${mode}" == "dockerhub_arg_tag" ]]; then
            if [[ -n "${TARGET_VERSION}" ]]; then
              value="${TARGET_VERSION}"
            else
              value="$(python3 - <<'PY'
          import json
          import re
          import urllib.request

          repo = "${{ matrix.dockerhub_repo }}"
          url = f"https://registry.hub.docker.com/v2/repositories/{repo}/tags?page_size=100"
          data = json.load(urllib.request.urlopen(url, timeout=30))
          tags = []
          for item in data.get("results", []):
              name = item.get("name", "")
              if re.fullmatch(r"[0-9]+(\.[0-9]+){1,3}(-[0-9A-Za-z.]+)?|[0-9]+\.[0-9]+\.[0-9]+-beta[0-9]+", name):
                  tags.append(name)

          def key(tag):
              nums = [int(x) for x in re.findall(r"\d+", tag)]
              beta = -1 if "beta" in tag else 0
              return (*nums, beta)

          if not tags:
              raise SystemExit("no semver-like Docker Hub tags found")
          print(sorted(tags, key=key)[-1])
          PY
              )"
            fi
            [[ -n "${value}" ]] || { echo "ERROR: could not resolve latest Docker Hub tag" >&2; exit 1; }
          else
            echo "ERROR: unsupported mode ${mode}" >&2
            exit 1
          fi

          safe="${value//\//-}"
          safe="${safe//:/-}"
          short="${safe:0:12}"
          branch="auto/${{ matrix.tag_prefix }}-${short}"

          {
            echo "value=${value}"
            echo "short=${short}"
            echo "branch=${branch}"
          } >> "$GITHUB_OUTPUT"

      - name: Apply update candidate
        if: ${{ (env.MANUAL_ADDON == 'all' || env.MANUAL_ADDON == matrix.addon) && matrix.mode != 'noop' }}
        shell: bash
        env:
          VALUE: ${{ steps.target.outputs.value }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          import re
          import sys
          from pathlib import Path

          addon = "${{ matrix.addon }}"
          mode = "${{ matrix.mode }}"
          value = os.environ["VALUE"]
          dockerfile = Path(addon, "Dockerfile")
          config = Path(addon, "config.yaml")

          if not dockerfile.is_file():
              print(f"ERROR: missing {dockerfile}", file=sys.stderr)
              raise SystemExit(1)

          text = dockerfile.read_text(encoding="utf-8")
          original = text

          def replace_arg(arg_name: str, new_value: str) -> None:
              global text
              pattern = rf"(?m)^(ARG\s+{re.escape(arg_name)}\s*=\s*).+$"
              repl = rf"\g<1>{new_value}"
              updated, count = re.subn(pattern, repl, text, count=1)
              if count == 0:
                  print(f"ERROR: ARG {arg_name}=... not found in {dockerfile}", file=sys.stderr)
                  raise SystemExit(1)
              text = updated

          def replace_from(image_prefix: str, new_tag: str) -> None:
              global text
              pattern = rf"(?m)^(FROM\s+{re.escape(image_prefix)}:).+$"
              repl = rf"\g<1>{new_tag}"
              updated, count = re.subn(pattern, repl, text, count=1)
              if count == 0:
                  print(f"ERROR: FROM {image_prefix}:... not found in {dockerfile}", file=sys.stderr)
                  raise SystemExit(1)
              text = updated

          if mode in ("github_branch_ref", "github_latest_release_arg", "dockerhub_arg_tag"):
              replace_arg("${{ matrix.arg_name }}", value)
          elif mode == "dockerhub_from_tag":
              replace_from("${{ matrix.image_prefix }}", value)
          else:
              print(f"ERROR: unsupported mode {mode}", file=sys.stderr)
              raise SystemExit(1)

          if text != original:
              dockerfile.write_text(text, encoding="utf-8")
          else:
              print("No Dockerfile change required.")

          # Do not auto-bump config.yaml version here. Add-on version remains an explicit maintainer decision.
          PY

      - name: Static validate changed add-on
        if: ${{ (env.MANUAL_ADDON == 'all' || env.MANUAL_ADDON == matrix.addon) && matrix.mode != 'noop' }}
        shell: bash
        run: |
          set -euo pipefail

          test -f "${{ matrix.addon }}/config.yaml"
          test -f "${{ matrix.addon }}/Dockerfile"

          if [[ -f "${{ matrix.addon }}/build.yaml" ]]; then
            echo "ERROR: ${{ matrix.addon }}/build.yaml exists but is deprecated." >&2
            exit 1
          fi

          python3 - <<'PY'
          import yaml
          from pathlib import Path

          addon = "${{ matrix.addon }}"
          data = yaml.safe_load(Path(addon, "config.yaml").read_text(encoding="utf-8")) or {}
          for key in ("name", "version", "slug", "image", "arch"):
              if key not in data:
                  raise SystemExit(f"missing config key: {key}")
          print(f"OK: {addon} {data['version']}")
          PY

      - name: Stop when no update is required
        id: diff
        if: ${{ (env.MANUAL_ADDON == 'all' || env.MANUAL_ADDON == matrix.addon) && matrix.mode != 'noop' }}
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- "${{ matrix.addon }}/Dockerfile" "${{ matrix.addon }}/config.yaml" "${{ matrix.addon }}/CHANGELOG.md"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No update required for ${{ matrix.addon }}."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff -- "${{ matrix.addon }}/Dockerfile" "${{ matrix.addon }}/config.yaml" "${{ matrix.addon }}/CHANGELOG.md" || true
          fi

      - name: Create or update pull request
        if: ${{ steps.diff.outputs.changed == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_BRANCH: ${{ steps.target.outputs.branch }}
          TARGET_VALUE: ${{ steps.target.outputs.value }}
          SHORT_VALUE: ${{ steps.target.outputs.short }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -B "${TARGET_BRANCH}"
          git add "${{ matrix.addon }}/Dockerfile" "${{ matrix.addon }}/config.yaml" "${{ matrix.addon }}/CHANGELOG.md" 2>/dev/null || true
          git commit -m "${{ matrix.addon }}: update upstream to ${SHORT_VALUE}"
          git push --force-with-lease origin "${TARGET_BRANCH}"

          title="${{ matrix.addon }}: update upstream to ${SHORT_VALUE}"
          body="$(cat <<EOF
          Automated safe-update candidate.

          - Add-on directory: \`${{ matrix.addon }}/\`
          - Update mode: \`${{ matrix.mode }}\`
          - Target: \`${TARGET_VALUE}\`
          - Base branch: \`${BASE_BRANCH}\`

          Add-on version in \`config.yaml\` was not auto-bumped. Review the Dockerfile diff, update the add-on version/changelog if required, then merge.
          EOF
          )"

          if gh pr view "${TARGET_BRANCH}" --json number >/dev/null 2>&1; then
            gh pr edit "${TARGET_BRANCH}" --title "${title}" --body "${body}"
          else
            gh pr create \
              --base "${BASE_BRANCH}" \
              --head "${TARGET_BRANCH}" \
              --title "${title}" \
              --body "${body}"
          fi
