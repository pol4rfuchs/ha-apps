name: "26 - Unbound Auto-Bump Trigger Build"

# When the PR opened by 25-unbound-auto-bump.yml gets merged, this opens the "verify on the
# Pi" reminder issue.
#
# It no longer starts the build itself: unbound is not managed by Release Please, so the
# push to main that the merge causes already starts 03-build-publish-ghcr.yml for every
# such app whose folder changed. Dispatching 03 here as well built and published the same
# version twice (the two runs sit in different concurrency groups).

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  issues: write

jobs:
  trigger-build:
    if: >
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'auto/unbound-bump-')
    runs-on: ubuntu-24.04
    steps:
      - name: Open Pi-test reminder issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: "unbound: verify on Pi after auto-bump build",
              labels: ["unbound"],
              body: [
                `Auto-bump PR #${process.env.PR_NUMBER} (${process.env.PR_URL}) was merged; the push to main starts the build/release automatically.`,
                ``,
                `Once the "03 Build Publish GHCR" run finishes and \`:latest\` is promoted:`,
                ``,
                `- [ ] Update the add-on on the Pi`,
                `- [ ] DNS resolving (\`dig @<pi-ip> -p 5053 example.com\`)`,
                `- [ ] ECS toggle`,
                `- [ ] No crash-loop`,
                ``,
                `_Auto-created by 26-unbound-auto-bump-trigger-build.yml_`
              ].join("\n")
            });
