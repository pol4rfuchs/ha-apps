name: 19 Version Badges Sync
on:
  push:
    branches:
      - main
    paths:
      - "*/Dockerfile"
      - "*/config.yaml"
      - "*/rootfs/**"
      - ".github/version-sync.json"
      - "scripts/sync_version_badges.py"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: version-badges-sync
  cancel-in-progress: true
jobs:
  sync:
    name: Sync README badges against real versions
    runs-on: ubuntu-24.04
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: true
      - name: Run sync script
        id: sync
        run: python3 scripts/sync_version_badges.py
      - name: Commit changes
        if: steps.sync.outputs.changed == 'true'
        env:
          CHANGED_LIST: ${{ steps.sync.outputs.changed_list }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- '*/README.md' '*/readme.md'
          git commit -m "chore(docs): sync version badges [skip ci]
          Aktualisierte Add-ons: ${CHANGED_LIST}"
          git push
