name: 13 YAML JSON Lint

on:
  pull_request:
    branches:
      - main
    paths:
      - "**/*.yaml"
      - "**/*.yml"
      - "**/*.json"
      - ".github/workflows/13-yaml-json-lint.yml"
  push:
    branches:
      - main
    paths:
      - "**/*.yaml"
      - "**/*.yml"
      - "**/*.json"
      - ".github/workflows/13-yaml-json-lint.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  yaml-json:
    name: YAML and JSON syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install YAML parser
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y python3-yaml

      - name: Validate YAML and JSON
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import sys
          from pathlib import Path

          try:
              import yaml
          except Exception:
              yaml = None

          errors = []
          skip_parts = {".git", "node_modules", "dist", "build", ".venv", "venv"}

          for path in Path(".").rglob("*"):
              if not path.is_file():
                  continue
              if any(part in skip_parts for part in path.parts):
                  continue
              suffix = path.suffix.lower()
              if suffix in (".yaml", ".yml"):
                  if yaml is None:
                      continue
                  try:
                      yaml.safe_load(path.read_text(encoding="utf-8"))
                  except Exception as exc:
                      errors.append(f"{path}: {exc}")
              elif suffix == ".json":
                  try:
                      json.loads(path.read_text(encoding="utf-8"))
                  except Exception as exc:
                      errors.append(f"{path}: {exc}")

          if errors:
              print("\n".join(errors))
              sys.exit(1)

          print("YAML/JSON syntax OK")
          PY
