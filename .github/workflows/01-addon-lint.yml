name: 01 Add-on Lint

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "17 2 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint ${{ matrix.addon }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        addon:
          - intiface_central
          - matrix_synapse
          - navidrome
          - nginx_proxy_manager
          - ntfy
          - ntfy_manager
          - searxng
          - teamspeak6
          - ts6_manager

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install validation tooling
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --user --disable-pip-version-check PyYAML

      - name: Static add-on layout lint
        shell: bash
        run: |
          set -euo pipefail
          addon="${{ matrix.addon }}"
          test -d "$addon"
          test -f "$addon/config.yaml"
          test -f "$addon/Dockerfile"
          test ! -f "$addon/build.yaml"
          test ! -f "$addon/repository.yaml"
          test ! -d "$addon/rootfs/etc/services.d"
          python3 - "$addon" <<'PY'
          import pathlib
          import sys
          import yaml

          addon = pathlib.Path(sys.argv[1])
          cfg_path = addon / "config.yaml"
          cfg = yaml.safe_load(cfg_path.read_text(encoding="utf-8")) or {}

          required = ["name", "version", "slug", "description", "arch", "image", "url"]
          missing = [key for key in required if key not in cfg or cfg[key] in (None, "", [])]
          if missing:
              raise SystemExit(f"{cfg_path}: missing required keys: {missing}")

          arch = cfg.get("arch")
          if not isinstance(arch, list) or not arch:
              raise SystemExit(f"{cfg_path}: arch must be a non-empty list")
          allowed_arch = {"aarch64", "amd64"}
          invalid_arch = sorted(set(arch) - allowed_arch)
          if invalid_arch:
              raise SystemExit(f"{cfg_path}: unsupported arch entries: {invalid_arch}")

          image = str(cfg.get("image", ""))
          if not image.startswith("ghcr.io/pol4rfuchs/"):
              raise SystemExit(f"{cfg_path}: image must point to ghcr.io/pol4rfuchs/...")

          url = str(cfg.get("url", ""))
          if "github.com/pol4rfuchs/ha-apps" not in url.lower():
              raise SystemExit(f"{cfg_path}: url must point to github.com/pol4rfuchs/ha-apps")

          print(f"{addon}: static lint OK")
          PY

      - name: Home Assistant add-on linter advisory
        uses: frenck/action-addon-linter@f995494fd84fae6310d23617e66d0e37de4f14eb # v2.21
        continue-on-error: true
        with:
          path: "./${{ matrix.addon }}"

      - name: Explain advisory mode
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'MD'
          Home Assistant add-on linter ran in advisory mode.

          Required gate in this workflow is the static monorepo/layout lint above. The upstream linter is kept visible for cleanup work, but it is not allowed to block builds for legacy config defaults that are still accepted by the current add-on setup.
          MD
