---
# Daily repo stats for the README badges: visitors (GitHub traffic API) and GHCR package downloads.
# The numbers live on the orphan branch `stats`, never on main, so the main ruleset is not involved.
name: 31 Repo Stats

# yamllint disable-line rule:truthy
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repo-stats
  cancel-in-progress: false

jobs:
  stats:
    name: Update stats branch
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Collect stats
        env:
          # APP_TOKEN, not GITHUB_TOKEN: the traffic API needs push access, which GITHUB_TOKEN
          # with contents: read does not have. The same token pushes the stats branch.
          GH_TOKEN: ${{ secrets.APP_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w0)"
          echo "::add-mask::${auth}"
          git_auth=(-c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}")
          remote="https://github.com/${REPO}.git"

          if git "${git_auth[@]}" ls-remote --exit-code --heads "${remote}" stats >/dev/null 2>&1; then
            git "${git_auth[@]}" clone --depth 1 --branch stats "${remote}" stats-data
          else
            git init -q -b stats stats-data
            git -C stats-data remote add origin "${remote}"
          fi

          python3 scripts/update_repo_stats.py --out-dir stats-data --repo "${REPO}" --addons addons.json

          cd stats-data
          printf '%s\n' '# stats' '' \
            'Generated by workflow 31 Repo Stats. Do not edit; used by the badges in the main README.' > README.md
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -q -m "chore(stats): update repo stats"
          git "${git_auth[@]}" push origin stats
