---
name: GHCR Cleanup

# The cron trigger is deliberately disabled (manual only via workflow_dispatch).
# Reason: the multi-arch images are created with "docker buildx imagetools create"
# from individual digests. After the intermediate tags (:<version>-amd64/-arm64)
# are deleted, these child manifests show up in GHCR as "untagged". delete-only-untagged-
# versions then deletes them, and older versions can no longer be pulled.
# Before re-enabling, switch to a multi-arch-capable cleanup or
# check it on a test package first. (Package names = image: from config.yaml.)
# yamllint disable-line rule:truthy
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  cleanup:
    name: Cleanup ${{ matrix.package }}
    runs-on: ubuntu-24.04
    permissions:
      packages: write  # required to delete GHCR package versions
    strategy:
      fail-fast: false
      matrix:
        package:
          - forgejo
          - intiface_central
          - matrix_auth_service
          - matrix_ketesa
          - matrix_signal_bridge
          - matrix_synapse
          - matrix_telegram_bridge
          - matrix_whatsapp_bridge
          - navidrome
          - nextcloud
          - nginx_proxy_manager
          - ntfy
          - ntfy_manager
          - restic_backup
          - searxng
          - teamspeak6
          - ts6_manager
          - unbound
          - unifi_toolkit
          - unifi_os_control_center
          - vaultwarden
          - cortendesk
    steps:
      - name: Delete old untagged versions
        continue-on-error: true
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5
        with:
          package-name: ${{ matrix.package }}
          package-type: container
          min-versions-to-keep: 2
          delete-only-untagged-versions: true
