name: GHCR Cleanup
on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        package:
          - searxng-ha-app
          - intiface-ha-app
          - matrix-synapse-ha-app
          - npm-ha-app
          - teamspeak6-ha-app
          - ntfy-ha-app
          - teamspeak6-manager-ha-app
          - navidrome-ha-app
          - ntfy-manager-ha-app
    steps:
      - name: Delete old untagged versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ matrix.package }}
          package-type: container
          min-versions-to-keep: 2
          delete-only-untagged-versions: true