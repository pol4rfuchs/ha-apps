---
name: GHCR Cleanup

# Der Cron-Trigger ist bewusst deaktiviert (nur manuell ueber workflow_dispatch).
# Grund: Die Multi-Arch-Images entstehen per "docker buildx imagetools create"
# aus Einzel-Digests. Nach dem Loeschen der Zwischentags (:<version>-amd64/-arm64)
# erscheinen diese Child-Manifests in GHCR als "untagged". delete-only-untagged-
# versions loescht sie dann, und aeltere Versionen sind nicht mehr pullbar.
# Vor dem Wieder-Aktivieren auf ein Multi-Arch-faehiges Cleanup umstellen oder
# erst an einem Test-Package pruefen. (Package-Namen = image: aus config.yaml.)
# yamllint disable-line rule:truthy
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  cleanup:
    name: Cleanup ${{ matrix.package }}
    runs-on: ubuntu-24.04
    permissions:
      packages: write  # required to delete GHCR package versions
    strategy:
      fail-fast: false
      matrix:
        package:
          - forgejo
          - intiface_central
          - matrix_auth_service
          - matrix_signal_bridge
          - matrix_synapse
          - matrix_telegram_bridge
          - matrix_whatsapp_bridge
          - navidrome
          - nextcloud
          - nginx_proxy_manager
          - ntfy
          - ntfy_manager
          - restic_backup
          - searxng
          - teamspeak6
          - ts6_manager
          - unbound
          - unifi_toolkit
          - unifi_os_control_center
          - vaultwarden
    steps:
      - name: Delete old untagged versions
        continue-on-error: true
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5
        with:
          package-name: ${{ matrix.package }}
          package-type: container
          min-versions-to-keep: 2
          delete-only-untagged-versions: true
