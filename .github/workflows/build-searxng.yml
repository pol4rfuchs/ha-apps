name: Build searxng

on:
  push:
    branches: [main]
    paths:
      - 'searxng/**'
      - '.github/workflows/build-searxng.yml'
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/pol4rfuchs/searxng-ha-app
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read add-on version
        id: addon
        shell: bash
        run: |
          set -euo pipefail
          version="$(python3 - <<'PY'
          from pathlib import Path
          for line in Path("searxng/config.yaml").read_text(encoding="utf-8").splitlines():
              stripped = line.strip()
              if stripped.startswith("version:"):
                  value = stripped.split(":", 1)[1].strip().strip('"').strip("'")
                  if not value:
                      raise SystemExit("empty version in searxng/config.yaml")
                  print(value)
                  break
          else:
              raise SystemExit("version not found in searxng/config.yaml")
          PY
          )"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./searxng
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.addon.outputs.version }}
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          build-args: |
            BUILD_VERSION=${{ steps.addon.outputs.version }}
          cache-from: type=gha,scope=searxng
          cache-to: type=gha,mode=max,scope=searxng
