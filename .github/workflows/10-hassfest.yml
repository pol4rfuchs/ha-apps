name: 10 Hassfest

on:
  pull_request:
    branches:
      - main
    paths:
      - custom_components/**
      - ".github/workflows/10-hassfest.yml"
  push:
    branches:
      - main
    paths:
      - custom_components/**
      - ".github/workflows/10-hassfest.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hassfest:
    name: Hassfest if custom_components exists
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Run hassfest
        if: ${{ hashFiles('custom_components/**/manifest.json') != '' }}
        uses: home-assistant/actions/hassfest@868e6cb4607727d764341a158d98872cd63fa658 # master

      - name: Skip
        if: ${{ hashFiles('custom_components/**/manifest.json') == '' }}
        run: echo "No custom integration manifests found; skipping hassfest."
