name: 10 Hassfest

on:
  pull_request:
    branches:
      - main
    paths:
      - custom_components/**
      - ".github/workflows/10-hassfest.yml"
  push:
    branches:
      - main
    paths:
      - custom_components/**
      - ".github/workflows/10-hassfest.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hassfest:
    name: Hassfest if custom_components exists
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Run hassfest
        if: ${{ hashFiles('custom_components/**/manifest.json') != '' }}
        uses: home-assistant/actions/hassfest@e91ad1948e57189485b9c1ad608af0c303946f89 # master

      - name: Skip
        if: ${{ hashFiles('custom_components/**/manifest.json') == '' }}
        run: echo "No custom integration manifests found; skipping hassfest."
