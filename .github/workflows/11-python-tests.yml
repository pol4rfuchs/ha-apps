name: 11 Python Tests

on:
  pull_request:
    branches:
      - main
    paths:
      - "**/*.py"
      - requirements*.txt
      - pyproject.toml
      - ".github/workflows/11-python-tests.yml"
  push:
    branches:
      - main
    paths:
      - "**/*.py"
      - requirements*.txt
      - pyproject.toml
      - ".github/workflows/11-python-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    name: Pytest if tests exist
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        if: ${{ hashFiles('**/tests/test_*.py') != '' }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"

      - name: Install test dependencies
        if: ${{ hashFiles('**/tests/test_*.py') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ -f requirements_test.txt ]; then pip install -r requirements_test.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          pip install pytest

      - name: Run pytest
        if: ${{ hashFiles('**/tests/test_*.py') != '' }}
        # Tests live in <app>/tests/ (each app has its own conftest.py and test names that
        # would collide in one run), so run every folder that has pytest files on its own.
        shell: bash
        run: |
          set -euo pipefail
          for dir in */tests; do
            if compgen -G "${dir}/test_*.py" > /dev/null; then
              echo "::group::pytest ${dir}"
              python -m pytest -q "${dir}"
              echo "::endgroup::"
            fi
          done

      - name: Skip
        if: ${{ hashFiles('**/tests/test_*.py') == '' }}
        run: echo "No <app>/tests/test_*.py found; skipping pytest."
