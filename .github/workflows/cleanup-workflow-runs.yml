name: Cleanup old workflow runs

on:
  schedule:
    - cron: "0 3 * * 0"  # every Sunday 03:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only simulate, delete nothing"
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      retain_days:
        description: "Days to keep runs"
        default: "30"
      keep_minimum_runs:
        description: "Minimum number of runs per workflow"
        default: "10"

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: read
    steps:
      - name: Delete old workflow runs
        uses: Mattraks/delete-workflow-runs@b3018382ca039b53d238908238bd35d1fb14f8ee # v2.1.0
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: ${{ github.event.inputs.retain_days || '30' }}
          keep_minimum_runs: ${{ github.event.inputs.keep_minimum_runs || '10' }}
          delete_workflow_by_state_pattern: ALL
          delete_run_by_conclusion_pattern: ALL
          # Both checks OFF: otherwise all runs on main (the branch always exists)
          # and all runs of Renovate/Release Please PRs are kept permanently.
          check_pullrequest_exist: false
          check_branch_existence: false
          dry_run: ${{ github.event.inputs.dry_run || 'false' }}
