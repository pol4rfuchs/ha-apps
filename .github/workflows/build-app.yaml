name: Build app

on:
  workflow_call:
    inputs:
      app:
        required: true
        type: string
      publish:
        required: true
        type: boolean

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  # ── 1. Read config.yaml, resolve arch → runner matrix ──────────────────────
  prepare:
    name: Prepare ${{ inputs.app }}
    runs-on: ubuntu-latest
    outputs:
      image:    ${{ steps.info.outputs.image }}
      version:  ${{ steps.info.outputs.version }}
      name:     ${{ steps.info.outputs.name }}
      slug:     ${{ steps.info.outputs.slug }}
      matrix:   ${{ steps.info.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Read add-on config
        id: info
        shell: bash
        run: |
          set -euo pipefail
          app="${{ inputs.app }}"
          test -f "${app}/config.yaml"
          test -f "${app}/Dockerfile"

          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import re
          from pathlib import Path

          app = "${{ inputs.app }}"
          text = Path(app, "config.yaml").read_text(encoding="utf-8")

          def scalar(key: str) -> str:
              m = re.search(rf"(?m)^\s*{re.escape(key)}\s*:\s*['\"]?([^'\"\n#]+)", text)
              return m.group(1).strip().strip("'\"") if m else ""

          def list_value(key: str) -> list[str]:
              m = re.search(rf"(?ms)^\s*{re.escape(key)}\s*:\s*\n((?:\s+-\s+[^\n]+\n?)+)", text)
              if m:
                  return [x.strip().strip("'\"") for x in re.findall(r"(?m)^\s*-\s*([^\n#]+)", m.group(1))]
              one = scalar(key)
              if one.startswith("[") and one.endswith("]"):
                  return [x.strip().strip("'\"") for x in one[1:-1].split(",") if x.strip()]
              return [one] if one else []

          image   = scalar("image")
          version = scalar("version")
          name    = scalar("name")
          slug    = scalar("slug") or app
          arch    = list_value("arch")

          if not image.startswith("ghcr.io/pol4rfuchs/"):
              raise SystemExit(f"invalid image: {image}")
          if not version:
              raise SystemExit("missing version")
          if not arch:
              raise SystemExit("missing arch")

          arch_map = {
              "amd64":   {"platform": "linux/amd64",  "runner": "ubuntu-latest",    "suffix": "amd64"},
              "aarch64": {"platform": "linux/arm64",  "runner": "ubuntu-24.04-arm", "suffix": "arm64"},
          }
          bad = sorted(set(arch) - set(arch_map))
          if bad:
              raise SystemExit(f"unsupported arch: {bad}")

          matrix = [{"platform": arch_map[a]["platform"],
                     "runner":   arch_map[a]["runner"],
                     "suffix":   arch_map[a]["suffix"]} for a in arch]

          print(f"image={image}")
          print(f"version={version}")
          print(f"name={name}")
          print(f"slug={slug}")
          print(f"matrix={json.dumps(matrix)}")
          PY

      - name: Summary
        shell: bash
        run: |
          echo "App:     ${{ inputs.app }}"
          echo "Image:   ${{ steps.info.outputs.image }}"
          echo "Version: ${{ steps.info.outputs.version }}"
          echo "Matrix:  ${{ steps.info.outputs.matrix }}"

  # ── 2. Build each platform on its native runner ─────────────────────────────
  build:
    name: Build ${{ inputs.app }} (${{ matrix.suffix }})
    needs: prepare
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        if: inputs.publish
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image (${{ matrix.suffix }})
        uses: docker/build-push-action@v7
        with:
          context: ./${{ inputs.app }}
          platforms: ${{ matrix.platform }}
          # Push single-platform digest; manifest job merges them.
          # On test builds (publish=false) we load locally to verify.
          push: ${{ inputs.publish }}
          load: ${{ !inputs.publish }}
          provenance: false
          sbom: false
          build-args: |
            BUILD_VERSION=${{ needs.prepare.outputs.version }}
            VERSION=${{ needs.prepare.outputs.version }}
          tags: |
            ${{ needs.prepare.outputs.image }}:${{ needs.prepare.outputs.version }}-${{ matrix.suffix }}
          cache-from: type=gha,scope=${{ inputs.app }}-${{ matrix.suffix }}
          cache-to:   type=gha,mode=max,scope=${{ inputs.app }}-${{ matrix.suffix }}

  # ── 3. Merge per-platform images into a single multi-arch manifest ───────────
  manifest:
    name: Manifest ${{ inputs.app }}
    needs: [prepare, build]
    if: inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifest
        shell: bash
        env:
          IMAGE:   ${{ needs.prepare.outputs.image }}
          VERSION: ${{ needs.prepare.outputs.version }}
          MATRIX:  ${{ needs.prepare.outputs.matrix }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json, os, subprocess
          matrix  = json.loads(os.environ['MATRIX'])
          image   = os.environ['IMAGE']
          version = os.environ['VERSION']
          sources = [f"{image}:{version}-{e['suffix']}" for e in matrix]
          cmd = ['docker', 'buildx', 'imagetools', 'create',
                 '--tag', f'{image}:{version}',
                 '--tag', f'{image}:latest',
                 *sources]
          subprocess.run(cmd, check=True)
          subprocess.run(['docker', 'buildx', 'imagetools', 'inspect',
                          f'{image}:{version}'], check=True)
          print('Manifest pushed successfully')
          PY

      - name: Delete intermediate platform tags
        if: inputs.publish
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE:    ${{ needs.prepare.outputs.image }}
          VERSION:  ${{ needs.prepare.outputs.version }}
          MATRIX:   ${{ needs.prepare.outputs.matrix }}
          OWNER:    ${{ github.repository_owner }}
        run: |
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json, os, subprocess
          matrix  = json.loads(os.environ['MATRIX'])
          image   = os.environ['IMAGE']
          version = os.environ['VERSION']
          owner   = os.environ['OWNER']
          pkg     = image.split('/')[-1]
          for e in matrix:
              tag = f"{version}-{e['suffix']}"
              print(f'Deleting intermediate tag: {pkg}:{tag}')
              res = subprocess.run(
                  ['gh', 'api',
                   f'https://api.github.com/users/{owner}/packages/container/{pkg}/versions',
                   '--paginate',
                   '--jq', f'.[] | select(.metadata.container.tags[] == "{tag}") | .id'],
                  capture_output=True, text=True)
              vid = res.stdout.strip().split('\n')[0] if res.stdout.strip() else ''
              if vid:
                  r = subprocess.run(
                      ['gh', 'api', '--method', 'DELETE',
                       f'https://api.github.com/users/{owner}/packages/container/{pkg}/versions/{vid}'],
                      capture_output=True)
                  if r.returncode == 0:
                      print(f'Deleted version ID {vid} ({tag})')
                  else:
                      print(f'Warning: could not delete {tag} (non-fatal)')
              else:
                  print(f'Tag {tag} not found or already gone — skipping')
          PY
