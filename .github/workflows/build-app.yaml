name: Build app

on:
  workflow_call:
    inputs:
      app:
        required: true
        type: string
      publish:
        required: true
        type: boolean
      version_override:
        description: >
          Version pulled from the release tag (e.g. "1.1.14" out of
          "teamspeak6-v1.1.14"). When set, this wins over config.yaml's
          version field — config.yaml can briefly still hold the previous
          version after a release-please merge, until the sync-versions
          job in 05-release-please.yml lands its fix-up commit. Empty for
          workflow_dispatch runs, where config.yaml is the only source.
        required: false
        type: string
        default: ""

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  # ── 1. Read config.yaml, resolve arch → runner matrix ──────────────────────
  prepare:
    name: Prepare ${{ inputs.app }}
    runs-on: ubuntu-latest
    outputs:
      image:    ${{ steps.info.outputs.image }}
      version:  ${{ steps.info.outputs.version }}
      name:     ${{ steps.info.outputs.name }}
      slug:     ${{ steps.info.outputs.slug }}
      matrix:   ${{ steps.info.outputs.matrix }}
      app:      ${{ steps.info.outputs.app }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Read add-on config
        id: info
        shell: bash
        env:
          APP: ${{ inputs.app }}
          VERSION_OVERRIDE: ${{ inputs.version_override }}
        run: |
          set -euo pipefail
          app="${APP}"
          test -f "${app}/config.yaml"
          test -f "${app}/Dockerfile"

          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          import re
          import sys
          from pathlib import Path

          app = os.environ["APP"]
          version_override = os.environ.get("VERSION_OVERRIDE", "").strip()
          text = Path(app, "config.yaml").read_text(encoding="utf-8")

          def scalar(key: str) -> str:
              m = re.search(rf"(?m)^\s*{re.escape(key)}\s*:\s*['\"]?([^'\"\n#]+)", text)
              return m.group(1).strip().strip("'\"") if m else ""

          def list_value(key: str) -> list[str]:
              m = re.search(rf"(?ms)^\s*{re.escape(key)}\s*:\s*\n((?:\s+-\s+[^\n]+\n?)+)", text)
              if m:
                  return [x.strip().strip("'\"") for x in re.findall(r"(?m)^\s*-\s*([^\n#]+)", m.group(1))]
              one = scalar(key)
              if one.startswith("[") and one.endswith("]"):
                  return [x.strip().strip("'\"") for x in one[1:-1].split(",") if x.strip()]
              return [one] if one else []

          image    = scalar("image")
          cfg_version = scalar("version")
          name     = scalar("name")
          slug     = scalar("slug") or app
          arch     = list_value("arch")

          # config.yaml can briefly lag the release tag right after a
          # release-please merge (sync-versions commit hasn't landed yet).
          # The tag itself is always correct the instant it's cut, so it
          # wins whenever we have one — config.yaml is the only source left
          # for manual workflow_dispatch reruns, where there is no tag.
          version = version_override or cfg_version
          if version_override and version_override != cfg_version:
              print(f"::notice::config.yaml version ({cfg_version!r}) lags the release tag "
                    f"({version_override!r}) — using the tag version, this is expected right "
                    f"after a release-please merge and gets reconciled by sync-versions shortly after.",
                    file=sys.stderr)
          if not image.startswith("ghcr.io/pol4rfuchs/"):
              raise SystemExit(f"invalid image: {image}")
          if not version:
              raise SystemExit("missing version")
          if not arch:
              raise SystemExit("missing arch")

          arch_map = {
              "amd64":   {"platform": "linux/amd64",  "runner": "ubuntu-latest",    "suffix": "amd64"},
              "aarch64": {"platform": "linux/arm64",  "runner": "ubuntu-24.04-arm", "suffix": "arm64"},
          }
          bad = sorted(set(arch) - set(arch_map))
          if bad:
              raise SystemExit(f"unsupported arch: {bad}")

          matrix = [{"platform": arch_map[a]["platform"],
                     "runner":   arch_map[a]["runner"],
                     "suffix":   arch_map[a]["suffix"]} for a in arch]

          print(f"image={image}")
          print(f"version={version}")
          print(f"name={name}")
          print(f"slug={slug}")
          print(f"matrix={json.dumps(matrix)}")
          print(f"app={app}")
          PY

      - name: Summary
        shell: bash
        env:
          APP: ${{ inputs.app }}
        run: |
          echo "App:     ${APP}"
          echo "Image:   ${{ steps.info.outputs.image }}"
          echo "Version: ${{ steps.info.outputs.version }}"
          echo "Matrix:  ${{ steps.info.outputs.matrix }}"

  # ── 2. Build each platform on its native runner ─────────────────────────────
  build:
    name: Build ${{ inputs.app }} (${{ matrix.suffix }})
    needs: prepare
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Login to GHCR
        if: inputs.publish
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          driver: docker

      - name: Build image (${{ matrix.suffix }})
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: ./${{ needs.prepare.outputs.app }}
          platforms: ${{ matrix.platform }}
          # Push single-platform digest; manifest job merges them.
          # On test builds (publish=false) we load locally to verify.
          push: ${{ inputs.publish }}
          load: ${{ !inputs.publish }}
          provenance: false
          sbom: false
          build-args: |
            BUILD_VERSION=${{ needs.prepare.outputs.version }}
            VERSION=${{ needs.prepare.outputs.version }}
          tags: |
            ${{ needs.prepare.outputs.image }}:${{ needs.prepare.outputs.version }}-${{ matrix.suffix }}

  # ── 3. Merge per-platform images into a single multi-arch manifest ───────────
  manifest:
    name: Manifest ${{ inputs.app }}
    needs: [prepare, build]
    if: inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Login to GHCR
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifest
        shell: bash
        env:
          IMAGE:   ${{ needs.prepare.outputs.image }}
          VERSION: ${{ needs.prepare.outputs.version }}
          MATRIX:  ${{ needs.prepare.outputs.matrix }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json, os, subprocess
          matrix  = json.loads(os.environ['MATRIX'])
          image   = os.environ['IMAGE']
          version = os.environ['VERSION']
          sources = [f"{image}:{version}-{e['suffix']}" for e in matrix]
          cmd = ['docker', 'buildx', 'imagetools', 'create',
                 '--tag', f'{image}:{version}',
                 *sources]
          subprocess.run(cmd, check=True)
          subprocess.run(['docker', 'buildx', 'imagetools', 'inspect',
                          f'{image}:{version}'], check=True)
          print('Manifest pushed successfully (version tag only, latest not yet promoted)')
          PY

  # ── 4. Smoke-test the pushed manifest before promoting :latest ──────────────
  # Best-effort for most add-ons: many HA add-ons are thin bashio wrappers
  # around upstream software (searxng, nextcloud, navidrome, ...) where the
  # real risk lives in the Dockerfile/build step, not the runtime entrypoint —
  # continue-on-error stays true there permanently, this is observation only.
  # For our own custom-built apps (ntfy_manager, ts6_manager) a startup crash
  # is much more likely to be an actual code bug, so the smoke test is a real
  # gate there: continue-on-error evaluates to false for exactly those two.
  smoke-test:
    name: Smoke test ${{ inputs.app }}
    needs: [prepare, manifest]
    if: inputs.publish
    runs-on: ubuntu-latest
    continue-on-error: ${{ inputs.app != 'ntfy_manager' && inputs.app != 'ts6_manager' }}
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Login to GHCR
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull pushed manifest
        env:
          IMAGE:   ${{ needs.prepare.outputs.image }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: docker pull "${IMAGE}:${VERSION}"

      # Most add-ons read /data/options.json via bashio::config at startup and
      # exit immediately when it's missing (not a code bug, just no Supervisor
      # around). Mounting a fixture built from the add-on's own `options:`
      # defaults gets them past that point for free. ts6_manager additionally
      # sources /data/secrets.env directly (no bashio involved there).
      - name: Build /data fixture from config.yaml defaults
        shell: bash
        env:
          APP: ${{ inputs.app }}
        run: |
          set -euo pipefail
          mkdir -p smoke-data
          pip install --quiet --disable-pip-version-check pyyaml
          python3 - <<'PY'
          import json, os, yaml
          app = os.environ["APP"]
          cfg = yaml.safe_load(open(f"{app}/config.yaml", encoding="utf-8")) or {}
          options = cfg.get("options", {}) or {}
          with open("smoke-data/options.json", "w", encoding="utf-8") as f:
              json.dump(options, f)
          print(f"Wrote smoke-data/options.json with keys: {sorted(options.keys())}")
          PY
          if [[ "${APP}" == "ts6_manager" ]]; then
            touch smoke-data/secrets.env
            mkdir -p smoke-data/music
          fi
          chmod -R a+rwX smoke-data

      - name: Start container and classify result
        shell: bash
        env:
          IMAGE:   ${{ needs.prepare.outputs.image }}
          VERSION: ${{ needs.prepare.outputs.version }}
          WAIT_SECONDS: "15"
        run: |
          set -uo pipefail
          cid="$(docker run -d -v "$(pwd)/smoke-data:/data" "${IMAGE}:${VERSION}")"
          echo "Started container ${cid}, waiting ${WAIT_SECONDS}s ..."
          sleep "${WAIT_SECONDS}"

          status="$(docker inspect -f '{{.State.Status}}' "${cid}")"
          logs="$(docker logs "${cid}" 2>&1)"
          echo "Container status after wait: ${status}"
          echo "${logs}"
          docker rm -f "${cid}" >/dev/null 2>&1 || true

          if [[ "${status}" == "running" ]]; then
            echo "Container stayed up for ${WAIT_SECONDS}s — smoke test passed."
            exit 0
          fi

          # Exited. Distinguish a real bug from an expected clean exit (e.g.
          # still missing a Supervisor REST call we don't fake, like ingress
          # URL lookup) by grepping for known crash signatures.
          crash_pattern='Traceback \(most recent call last\)|Segmentation fault|exec format error|Cannot find module|EADDRINUSE|panic:|FATAL ERROR|[Uu]nhandled ([Pp]romise )?[Rr]ejection|core dumped|Error: connect ECONNREFUSED'
          if echo "${logs}" | grep -E -q "${crash_pattern}"; then
            echo "::error::Container crashed with a real error signature (status=${status}) — this looks like an actual bug, not just a missing Supervisor environment. Check the log above."
            exit 1
          fi

          echo "::notice::Container exited (status=${status}) without a crash signature — likely still missing a Supervisor REST dependency we don't fake (e.g. ingress URL lookup), not necessarily a bug. Spot-check the log above if unsure."
          exit 0

  # ── 5. Promote :latest only after the smoke test had a chance to run ────────
  promote-latest:
    name: Promote latest ${{ inputs.app }}
    needs: [prepare, smoke-test]
    if: inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Login to GHCR
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag VERSION as latest
        env:
          IMAGE:   ${{ needs.prepare.outputs.image }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "${IMAGE}:latest" \
            "${IMAGE}:${VERSION}"
          docker buildx imagetools inspect "${IMAGE}:latest"
          echo "latest promoted to ${VERSION}"