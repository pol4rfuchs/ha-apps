name: Build app

on:
  workflow_call:
    inputs:
      app:
        required: true
        type: string
      publish:
        required: true
        type: boolean
      version_override:
        description: >
          Version pulled from the release tag (e.g. "1.1.14" out of
          "teamspeak6-v1.1.14"). When set, this wins over config.yaml's
          version field — config.yaml can briefly still hold the previous
          version after a release-please merge, until the sync-versions
          job in 05-release-please.yml lands its fix-up commit. Empty for
          workflow_dispatch runs, where config.yaml is the only source.
        required: false
        type: string
        default: ""

permissions:
  contents: read
  packages: write

jobs:
  # ── 1. Read config.yaml, resolve arch → runner matrix ──────────────────────
  prepare:
    name: Prepare ${{ inputs.app }}
    runs-on: ubuntu-24.04
    outputs:
      image: ${{ steps.info.outputs.image }}
      version: ${{ steps.info.outputs.version }}
      name: ${{ steps.info.outputs.name }}
      slug: ${{ steps.info.outputs.slug }}
      matrix: ${{ steps.info.outputs.matrix }}
      app: ${{ steps.info.outputs.app }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read add-on config
        id: info
        shell: bash
        env:
          APP: ${{ inputs.app }}
          VERSION_OVERRIDE: ${{ inputs.version_override }}
        run: |
          set -euo pipefail
          app="${APP}"
          test -f "${app}/config.yaml"
          test -f "${app}/Dockerfile"

          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          import re
          import sys
          from pathlib import Path

          app = os.environ["APP"]
          version_override = os.environ.get("VERSION_OVERRIDE", "").strip()
          text = Path(app, "config.yaml").read_text(encoding="utf-8")

          def scalar(key: str) -> str:
              m = re.search(rf"(?m)^\s*{re.escape(key)}\s*:\s*['\"]?([^'\"\n#]+)", text)
              return m.group(1).strip().strip("'\"") if m else ""

          def list_value(key: str) -> list[str]:
              m = re.search(rf"(?ms)^\s*{re.escape(key)}\s*:\s*\n((?:\s+-\s+[^\n]+\n?)+)", text)
              if m:
                  return [x.strip().strip("'\"") for x in re.findall(r"(?m)^\s*-\s*([^\n#]+)", m.group(1))]
              one = scalar(key)
              if one.startswith("[") and one.endswith("]"):
                  return [x.strip().strip("'\"") for x in one[1:-1].split(",") if x.strip()]
              return [one] if one else []

          image    = scalar("image")
          cfg_version = scalar("version")
          name     = scalar("name")
          slug     = scalar("slug") or app
          arch     = list_value("arch")

          # config.yaml can briefly lag the release tag right after a
          # release-please merge (sync-versions commit hasn't landed yet).
          # The tag itself is always correct the instant it's cut, so it
          # wins whenever we have one — config.yaml is the only source left
          # for manual workflow_dispatch reruns, where there is no tag.
          version = version_override or cfg_version
          if version_override and version_override != cfg_version:
              print(f"::notice::config.yaml version ({cfg_version!r}) lags the release tag "
                    f"({version_override!r}) — using the tag version, this is expected right "
                    f"after a release-please merge and gets reconciled by sync-versions shortly after.",
                    file=sys.stderr)
          if not image.startswith("ghcr.io/pol4rfuchs/"):
              raise SystemExit(f"invalid image: {image}")
          if not version:
              raise SystemExit("missing version")
          if not arch:
              raise SystemExit("missing arch")

          arch_map = {
              "amd64":   {"platform": "linux/amd64",  "runner": "ubuntu-24.04",    "suffix": "amd64", "build_arch": "amd64"},
              "aarch64": {"platform": "linux/arm64",  "runner": "ubuntu-24.04-arm", "suffix": "arm64", "build_arch": "aarch64"},
          }
          bad = sorted(set(arch) - set(arch_map))
          if bad:
              raise SystemExit(f"unsupported arch: {bad}")

          matrix = [{"platform": arch_map[a]["platform"],
                     "runner":   arch_map[a]["runner"],
                     "suffix":   arch_map[a]["suffix"],
                     "build_arch": arch_map[a]["build_arch"]} for a in arch]

          print(f"image={image}")
          print(f"version={version}")
          print(f"name={name}")
          print(f"slug={slug}")
          print(f"matrix={json.dumps(matrix)}")
          print(f"app={app}")
          PY

      - name: Summary
        shell: bash
        env:
          APP: ${{ inputs.app }}
        run: |
          echo "App:     ${APP}"
          echo "Image:   ${{ steps.info.outputs.image }}"
          echo "Version: ${{ steps.info.outputs.version }}"
          echo "Matrix:  ${{ steps.info.outputs.matrix }}"

  # ── 2. Build each platform on its native runner ─────────────────────────────
  build:
    name: Build ${{ inputs.app }} (${{ matrix.suffix }})
    needs: prepare
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Login to GHCR
        if: inputs.publish
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver: docker

      - name: Build image (${{ matrix.suffix }})
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./${{ needs.prepare.outputs.app }}
          platforms: ${{ matrix.platform }}
          # Push single-platform digest; manifest job merges them.
          # On test builds (publish=false) we load locally to verify.
          push: ${{ inputs.publish }}
          load: ${{ !inputs.publish }}
          provenance: false
          sbom: false
          # BUILD_ARCH uses the Home Assistant arch name (amd64/aarch64), not the
          # buildx suffix; it feeds io.hass.arch and the other ${BUILD_ARCH} labels.
          build-args: |
            BUILD_ARCH=${{ matrix.build_arch }}
            BUILD_VERSION=${{ needs.prepare.outputs.version }}
            VERSION=${{ needs.prepare.outputs.version }}
          tags: |
            ${{ needs.prepare.outputs.image }}:${{ needs.prepare.outputs.version }}-${{ matrix.suffix }}

  # ── 3. Merge per-platform images into a single multi-arch manifest ───────────
  manifest:
    name: Manifest ${{ inputs.app }}
    needs: [prepare, build]
    if: inputs.publish
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Login to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifest
        shell: bash
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          VERSION: ${{ needs.prepare.outputs.version }}
          MATRIX: ${{ needs.prepare.outputs.matrix }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json, os, subprocess
          matrix  = json.loads(os.environ['MATRIX'])
          image   = os.environ['IMAGE']
          version = os.environ['VERSION']
          sources = [f"{image}:{version}-{e['suffix']}" for e in matrix]
          cmd = ['docker', 'buildx', 'imagetools', 'create',
                 '--tag', f'{image}:{version}',
                 *sources]
          subprocess.run(cmd, check=True)
          subprocess.run(['docker', 'buildx', 'imagetools', 'inspect',
                          f'{image}:{version}'], check=True)
          print('Manifest pushed successfully (version tag only, latest not yet promoted)')
          PY

  # ── 4. Smoke-test the pushed manifest before promoting :latest ──────────────
  # Best-effort for most add-ons: many HA add-ons are thin bashio wrappers
  # around upstream software (searxng, nextcloud, navidrome, ...) where the
  # real risk lives in the Dockerfile/build step, not the runtime entrypoint —
  # continue-on-error stays true there permanently, this is observation only.
  # For our own custom-built apps (ntfy_manager, ts6_manager) a startup crash
  # is much more likely to be an actual code bug, so the smoke test is a real
  # gate there: continue-on-error evaluates to false for exactly those two.
  # teamspeak6 is also a real gate: it runs directly on top of the third-party
  # teamspeaksystems/teamspeak6-server image with a plain bash run.sh
  # entrypoint (no s6-overlay), so a startup crash here is just as likely to
  # be an actual regression in our run.sh as in a first-party app.
  smoke-test:
    name: Smoke test ${{ inputs.app }}
    needs: [prepare, manifest]
    if: inputs.publish
    runs-on: ubuntu-24.04
    continue-on-error: ${{ inputs.app != 'ntfy_manager' && inputs.app != 'ts6_manager' && inputs.app != 'teamspeak6' }}
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Login to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull pushed manifest
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: docker pull "${IMAGE}:${VERSION}"

      # bashio::config does not read /data/options.json, it asks the Supervisor
      # API (http://supervisor/addons/self/options/config). Without a stand-in
      # almost every app died with "Could not resolve host: supervisor" and the
      # test only ever saw that. scripts/smoke_supervisor.py builds the options
      # from config.yaml (required fields filled, passwords random, a few
      # per-app overrides) and serves them on port 80 of the runner; the
      # container reaches it as "supervisor" via host-gateway. options.json is
      # still mounted for apps that read it directly (teamspeak6).
      - name: Build /data fixture and start Supervisor stand-in
        shell: bash
        env:
          APP: ${{ inputs.app }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          pip install --quiet --disable-pip-version-check pyyaml
          python3 scripts/smoke_supervisor.py fixture "${APP}" smoke-data
          if [[ "${APP}" == "ts6_manager" ]]; then
            touch smoke-data/secrets.env
            mkdir -p smoke-data/music
          fi
          chmod -R a+rwX smoke-data
          # Port 80 needs root. --daemon binds the port, then detaches with its
          # output in supervisor-mock.log, so the step does not wait on it.
          sudo python3 scripts/smoke_supervisor.py serve smoke-data/options.json \
            --app "${APP}" --version "${VERSION}" --daemon --log supervisor-mock.log
          for _ in $(seq 1 20); do
            curl -sf http://127.0.0.1/addons/self/info >/dev/null && break
            sleep 0.5
          done
          curl -sf http://127.0.0.1/addons/self/options/config >/dev/null
          echo "Supervisor stand-in is up."

      - name: Start container and classify result
        shell: bash
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          VERSION: ${{ needs.prepare.outputs.version }}
          WAIT_SECONDS: "30"
        run: |
          set -uo pipefail
          cid="$(docker run -d \
            --add-host supervisor:host-gateway \
            -e SUPERVISOR_TOKEN=smoke \
            -v "$(pwd)/smoke-data:/data" \
            "${IMAGE}:${VERSION}")"
          echo "Started container ${cid}, waiting ${WAIT_SECONDS}s ..."
          sleep "${WAIT_SECONDS}"

          status="$(docker inspect -f '{{.State.Status}}' "${cid}")"
          exit_code="$(docker inspect -f '{{.State.ExitCode}}' "${cid}")"
          restarts="$(docker inspect -f '{{.RestartCount}}' "${cid}")"
          logs="$(docker logs "${cid}" 2>&1)"
          echo "Container status after wait: ${status} (exit code ${exit_code}, restarts ${restarts})"
          echo "${logs}"
          echo "── Supervisor stand-in requests ──"
          sort supervisor-mock.log 2>/dev/null | uniq -c || true
          docker rm -f "${cid}" >/dev/null 2>&1 || true

          # A crash signature fails the test even while the container is still
          # "running": s6 keeps the container alive while a service crash-loops,
          # which used to count as a pass.
          crash_pattern='Traceback \(most recent call last\)|Segmentation fault|exec format error|Cannot find module|EADDRINUSE|panic:|FATAL ERROR|[Uu]nhandled ([Pp]romise )?[Rr]ejection|core dumped|Error: connect ECONNREFUSED'
          if echo "${logs}" | grep -E -q "${crash_pattern}"; then
            echo "::error::Crash signature in the log (status=${status}) — check the log above."
            exit 1
          fi

          # bashio::exit.nok / log.fatal: the app refused to start. With the
          # stand-in and filled options this is usually a real problem, but it
          # can also be a dependency the test does not provide (MQTT, MariaDB).
          if echo "${logs}" | grep -E -q '\] FATAL: |Could not resolve host: supervisor'; then
            echo "::warning::App reported a fatal startup error (status=${status}) — check the log above."
          fi

          if [[ "${status}" == "running" ]]; then
            echo "Container stayed up for ${WAIT_SECONDS}s without a crash signature — smoke test passed."
            exit 0
          fi

          echo "::notice::Container exited (status=${status}, exit code ${exit_code}) without a crash" \
            "signature — likely a dependency the test does not provide (ingress, MQTT, database)." \
            "Spot-check the log above."
          exit 0

  # ── 5. Promote :latest only after the smoke test had a chance to run ────────
  promote-latest:
    name: Promote latest ${{ inputs.app }}
    needs: [prepare, smoke-test]
    if: inputs.publish
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Login to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag VERSION as latest
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "${IMAGE}:latest" \
            "${IMAGE}:${VERSION}"
          docker buildx imagetools inspect "${IMAGE}:latest"
          echo "latest promoted to ${VERSION}"
