---
# Automatically lock closed issues/PRs after 30 days
# Pure housekeeping: transient GitHub errors (5xx) are retried and
# afterwards only lead to a warning, not to a red run.
name: 17 Lock

# yamllint disable-line rule:truthy
on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: lock
  cancel-in-progress: true

jobs:
  lock:
    name: 🔒 Lock closed issues and PRs
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Lock stale closed issues and PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          cutoff=$(date -d '30 days ago' --iso-8601=seconds)
          tmp=$(mktemp)
          trap 'rm -f "${tmp}"' EXIT

          # Fetch all pages. On an error (e.g. HTTP 504) or if the response is
          # not an array (error object), retry up to 4 times with an increasing wait.
          fetch_all() {
            local url=$1 attempt
            for attempt in 1 2 3 4; do
              if gh api "${url}" --paginate > "${tmp}" 2> /dev/null \
                && jq -e -s 'all(.[]; type == "array")' "${tmp}" > /dev/null; then
                return 0
              fi
              echo "::warning::GitHub API request failed (attempt ${attempt}/4): ${url}"
              [ "${attempt}" -lt 4 ] && sleep $((attempt * 15))
            done
            return 1
          }

          # Applies to both endpoints: /pulls objects have no pull_request field
          # (null), /issues objects that are PRs have it and are skipped.
          lock_stale() {
            local label=$1 url=$2 num
            if ! fetch_all "${url}"; then
              echo "::warning::Skipping ${label} locking: GitHub API not available, retrying on next run"
              return 0
            fi
            jq -r --arg cutoff "${cutoff}"               '.[] | select(
                .locked == false
                and .pull_request == null
                and .updated_at < $cutoff
              ) | .number'               "${tmp}" | while read -r num; do
              echo "Locking ${label} #${num}"
              gh issue lock "${num}" --repo "${REPO}" --reason resolved || true
            done
          }

          lock_stale "issue" "repos/${REPO}/issues?state=closed&per_page=100"
          lock_stale "PR" "repos/${REPO}/pulls?state=closed&per_page=100"
