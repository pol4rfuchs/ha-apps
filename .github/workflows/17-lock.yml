---
# Geschlossene Issues/PRs nach 30 Tagen automatisch locken
name: 17 Lock

# yamllint disable-line rule:truthy
on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: lock
  cancel-in-progress: true

jobs:
  lock:
    name: 🔒 Lock closed issues and PRs
    runs-on: ubuntu-latest
    steps:
      - name: Lock stale closed issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          cutoff=$(date -d '30 days ago' --iso-8601=seconds)
          gh issue list \
            --repo "${REPO}" \
            --state closed \
            --json number,updatedAt,locked \
            --limit 100 \
            | jq -r --arg cutoff "${cutoff}" \
              '.[] | select(.locked == false and .updatedAt < $cutoff) | .number' \
          | while read -r num; do
            echo "Locking issue #${num}"
            gh issue lock "${num}" --repo "${REPO}" --reason resolved || true
          done

      - name: Lock stale closed PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          cutoff=$(date -d '30 days ago' --iso-8601=seconds)
          gh pr list \
            --repo "${REPO}" \
            --state closed \
            --json number,updatedAt,locked \
            --limit 100 \
            | jq -r --arg cutoff "${cutoff}" \
              '.[] | select(.locked == false and .updatedAt < $cutoff) | .number' \
          | while read -r num; do
            echo "Locking PR #${num}"
            gh issue lock "${num}" --repo "${REPO}" --reason resolved || true
          done