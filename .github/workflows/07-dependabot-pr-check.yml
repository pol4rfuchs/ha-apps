name: 07 Dependabot PR Check

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: dependabot-pr-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependabot-metadata:
    name: Dependabot metadata
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      - name: Print update class
        shell: bash
        env:
          DEPENDENCY_NAMES: ${{ steps.metadata.outputs.dependency-names }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          DIRECTORY: ${{ steps.metadata.outputs.directory }}
          PACKAGE_ECOSYSTEM: ${{ steps.metadata.outputs.package-ecosystem }}
        run: |
          echo "dependency-names=${DEPENDENCY_NAMES}"
          echo "update-type=${UPDATE_TYPE}"
          echo "directory=${DIRECTORY}"
          echo "package-ecosystem=${PACKAGE_ECOSYSTEM}"
