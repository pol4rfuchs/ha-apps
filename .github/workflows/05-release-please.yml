name: 05 Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Release Please monorepo
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Run Release Please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.APP_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main

  # After a Release Please merge the tag <component>-v<version> must exist.
  # Without it there is no GitHub release and no image build, and the next
  # release PR repeats old commits (this is how a missing
  # "autorelease: pending" label showed up). The check compares the manifest
  # of the pushed commit with its parent, so it does not depend on what the
  # release-please action reports.
  verify-release-tags:
    name: Verify release tags exist
    needs: release-please
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Every released version has its tag
        shell: bash
        env:
          REMOTE: origin
        run: |
          set -euo pipefail
          subject="$(git log -1 --format=%s HEAD)"
          if ! [[ "${subject}" =~ ^chore(\(.*\))?:\ release\  ]]; then
            echo "HEAD is not a release commit (${subject}), nothing to verify."
            exit 0
          fi
          if ! git rev-parse --verify -q HEAD~1 >/dev/null; then
            echo "HEAD has no parent, nothing to compare."
            exit 0
          fi
          pairs="$(python3 - <<'PY'
          import json
          import subprocess

          def manifest(rev):
              out = subprocess.run(
                  ["git", "show", f"{rev}:.release-please-manifest.json"],
                  capture_output=True, text=True, check=True,
              ).stdout
              return json.loads(out)

          old, new = manifest("HEAD~1"), manifest("HEAD")
          for component, version in sorted(new.items()):
              if old.get(component) != version:
                  print(f"{component}\t{version}")
          PY
          )"
          if [[ -z "${pairs}" ]]; then
            echo "Release commit without a manifest change, nothing to verify."
            exit 0
          fi
          missing=0
          while IFS=$'\t' read -r component version; do
            tag="${component}-v${version}"
            if [[ -n "$(git ls-remote --tags "${REMOTE}" "refs/tags/${tag}")" ]]; then
              echo "OK      ${tag}"
            else
              echo "::error title=Release tag missing::${tag} was released by this commit but the tag does not exist. No release and no image will be built; check the 'Run Release Please' step."
              missing=1
            fi
          done <<< "${pairs}"
          exit "${missing}"

  # We deliberately do NOT use release-please's built-in `extra-files`
  # (type: yaml + jsonpath) to bump config.yaml's `version:` field anymore.
  # Verified against the actual release-please source (generic-yaml.js): that
  # updater fully re-parses the YAML and re-serializes the *entire* document
  # via js-yaml's dump() to apply the jsonpath write. Two consequences we hit
  # in practice: (1) it strips quotes it considers unnecessary, e.g. turning
  # `version: "1.1.17"` into `version: 1.1.18` — harmless for parsing (PyYAML
  # reads both as the same string) but a needless extra commit's worth of
  # diff noise every single release; (2) per the updater's own doc comment,
  # a full re-serialization "removes all comments" — a real risk the moment
  # any of these config.yaml files ever gains a comment, even though none
  # currently have one. This job is the sole, deterministic mechanism that
  # bumps `version:` in every component's config.yaml: a targeted text-line
  # replace only, no full YAML re-serialization, so comments and formatting
  # are always preserved and quoting stays consistent.
  sync-versions:
    name: Sync config.yaml versions to manifest
    needs: release-please
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.APP_TOKEN }}
          ref: main
          # Intentional: this job needs the credential to git push the sync
          # commit further down. persist-credentials: false would break that.
          persist-credentials: true

      - name: Force-sync version fields from manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, re
          from pathlib import Path

          manifest = json.loads(Path(".release-please-manifest.json").read_text())
          changed = []

          for component, version in manifest.items():
              cfg_path = Path(component, "config.yaml")
              if not cfg_path.exists():
                  continue
              text = cfg_path.read_text(encoding="utf-8")
              new_text, n = re.subn(
                  r'(?m)^(version:\s*)["\']?[^\s"\'#]+["\']?',
                  rf'\g<1>"{version}"',
                  text,
                  count=1,
              )
              if n and new_text != text:
                  cfg_path.write_text(new_text, encoding="utf-8")
                  changed.append(f"{component} -> {version}")

          Path("/tmp/sync_changed.txt").write_text("\n".join(changed))
          print("Changed:", changed or "(none, all in sync)")
          PY

      - name: Commit and push if anything changed
        shell: bash
        run: |
          set -euo pipefail
          if [[ -s /tmp/sync_changed.txt ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -- '*/config.yaml'
            git commit -m "chore: force-sync config.yaml versions to release-please manifest

          $(cat /tmp/sync_changed.txt)"
          # Intentionally no [skip ci]: this push touches */config.yaml, and
          # 20-wiki-drift-check.yml needs to run on exactly this push to
          # catch drift introduced (or fixed) by the version sync itself.
          # [skip ci] would suppress every workflow for this push, not just
          # the heavy build/lint ones.
            # Retry: main may have moved between checkout and push (another
            # merge); rebase the sync commit on top and push again.
            for attempt in 1 2 3; do
              if git push origin main; then
                exit 0
              fi
              echo "Push rejected (attempt ${attempt}/3), rebasing onto origin/main ..."
              git pull --rebase origin main
            done
            echo "::error::Could not push the version sync commit after 3 attempts."
            exit 1
          else
            echo "No drift detected, nothing to commit."
          fi
