name: 05 Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Release Please monorepo
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Run Release Please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.APP_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main

  # Release Please's extra-files YAML updater does a regex partial-replace:
  # it looks for the *previous* version string inside the file and swaps it.
  # Once a config.yaml's version drifts from what release-please's manifest
  # thinks the previous version was (manual edit, conflict, anything), that
  # match fails silently and the file is never touched again. This job is a
  # deterministic safety net: it force-writes each component's `version:`
  # line to match .release-please-manifest.json, every run, regardless of
  # why it drifted. Text-line replace only — no full YAML re-serialization,
  # so comments and formatting in config.yaml are preserved untouched.
  sync-versions:
    name: Sync config.yaml versions to manifest
    needs: release-please
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          token: ${{ secrets.APP_TOKEN }}
          ref: main
          # Intentional: this job needs the credential to git push the sync
          # commit further down. persist-credentials: false would break that.
          persist-credentials: true

      - name: Force-sync version fields from manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, re
          from pathlib import Path

          manifest = json.loads(Path(".release-please-manifest.json").read_text())
          changed = []

          for component, version in manifest.items():
              cfg_path = Path(component, "config.yaml")
              if not cfg_path.exists():
                  continue
              text = cfg_path.read_text(encoding="utf-8")
              new_text, n = re.subn(
                  r'(?m)^(version:\s*)["\']?[^\s"\'#]+["\']?',
                  rf'\g<1>"{version}"',
                  text,
                  count=1,
              )
              if n and new_text != text:
                  cfg_path.write_text(new_text, encoding="utf-8")
                  changed.append(f"{component} -> {version}")

          Path("/tmp/sync_changed.txt").write_text("\n".join(changed))
          print("Changed:", changed or "(none, all in sync)")
          PY

      - name: Commit and push if anything changed
        shell: bash
        run: |
          set -euo pipefail
          if [[ -s /tmp/sync_changed.txt ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -- '*/config.yaml'
            git commit -m "chore: force-sync config.yaml versions to release-please manifest

          $(cat /tmp/sync_changed.txt)"
            git push origin main
          else
            echo "No drift detected, nothing to commit."
          fi
