name: 08 Docs Pages

on:
  push:
    branches:
      - main
    paths:
      - wiki/**
      - ".github/workflows/08-docs-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build wiki artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Prepare site
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -d wiki ]]; then
            echo "ERROR: wiki/ directory not found in repo root" >&2
            exit 1
          fi
          cp -r wiki _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Deploy Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
