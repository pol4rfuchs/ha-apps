name: 08 Docs Pages

on:
  push:
    branches:
      - main
    paths:
      - README.md
      - README_WORKFLOWS.md
      - "**/README.md"
      - "**/DOCS.md"
      - docs/**
      - ".github/workflows/08-docs-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build static docs artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build simple Pages site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cp README.md _site/index.md 2>/dev/null || printf '# ha-apps\n' > _site/index.md
          {
            echo "# ha-apps documentation index"
            echo
            find . -maxdepth 3 \( -name README.md -o -name DOCS.md \) -not -path './.git/*' -print | sort
          } > _site/readmes.md
          cp README_WORKFLOWS.md _site/workflows.md 2>/dev/null || true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
