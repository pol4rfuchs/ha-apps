user root;
worker_processes auto;
pid /run/nginx/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  access_log /var/log/nginx/access.log;

  sendfile on;
  keepalive_timeout 65;
  client_max_body_size 25M;

  # Gzip for SPA assets
  gzip on;
  gzip_types text/plain text/css application/javascript application/json application/wasm image/svg+xml;
  gzip_min_length 512;

  server {
    listen 8099 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SSE stream — unbuffered, long-lived
    location /api/ntfy/stream {
      proxy_pass http://127.0.0.1:3000/api/ntfy/stream;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 24h;
      proxy_send_timeout 24h;
      chunked_transfer_encoding off;
    }

    # All other API calls
    location /api/ {
      proxy_pass http://127.0.0.1:3000/api/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $host;
      proxy_read_timeout 600;
      proxy_send_timeout 600;
    }

    # SPA fallback
    location / {
      try_files $uri /index.html;
    }
  }
}
