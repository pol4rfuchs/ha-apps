---
name: "TS6 Manager"
description: "Web-based management interface for TeamSpeak 6 servers (WebQuery API)"
version: "1.0.4"
slug: "ts6_manager"
url: "https://github.com/pol4rfuchs/ha-apps"
image: "ghcr.io/pol4rfuchs/ts6_manager"
init: false
# apparmor.txt exists but is intentionally NOT yet enforced — test a full
# start + login + a real music download via yt-dlp + a clean restart
# before flipping this to true.
apparmor: false
arch:
  - aarch64
  - amd64
ports:
  8066/tcp: 8066
panel_icon: mdi:microphone
webui: "http://[HOST]:[PORT:8066]"
options:
  log_level: "info"
schema:
  log_level: "list(trace|debug|info|notice|warning|error|fatal)"
