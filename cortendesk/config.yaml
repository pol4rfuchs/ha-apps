---
name: "CortenDesk"
version: "0.2.1"
slug: "cortendesk"
description: "RustDesk console with embedded ID server and relay (CortenDesk, all-in-one)"
url: "https://github.com/pol4rfuchs/ha-apps"
arch:
  - aarch64
  - amd64
image: "ghcr.io/pol4rfuchs/cortendesk"
stage: experimental
init: false
# SQLite + hbbs database live in /data: cold = the app is stopped briefly for the
# backup so no half-written DB ends up in the backup.
backup: cold
webui: "http://[HOST]:[PORT:8080]"
watchdog: "tcp://[HOST]:[PORT:8080]"

# Ports: checked against the port table (21114-21117 free, 2026-10-17).
# Bridge mode with port mapping. 21118/21119 (WebSocket bridge hbbs/hbbr)
# deliberately stay unmapped (null): they listen on all addresses in the container, but
# are not published to the host (only reachable in the internal Docker network, tested 2026-10-17).
# hbbs/hbbr trust unchecked X-Forwarded-For headers there, so never map them.
ports:
  8080/tcp: 21114
  21115/tcp: 21115
  21116/tcp: 21116
  21116/udp: 21116
  21117/tcp: 21117
  21118/tcp: null
  21119/tcp: null

# app_url and admin_password are intentionally empty (no default password): as long as
# one of the two options is empty, the app exits with a message in the log.
# id_server and relay_server empty = host from app_url. downloads_max_mb 512 = upstream default.
options:
  app_url: ""
  admin_user: "admin"
  admin_password: ""
  native_webclient: false
  id_server: ""
  relay_server: ""
  downloads_max_mb: 512
  log_level: "INFO"
schema:
  app_url: "str"
  admin_user: "str"
  admin_password: "password"
  native_webclient: "bool"
  id_server: "str?"
  relay_server: "str?"
  downloads_max_mb: "int(1,4096)"
  log_level: "list(DEBUG|INFO|WARNING|ERROR)"

# AppArmor is off: apparmor.txt is an untested draft in COMPLAIN mode and is not
# loaded with apparmor: false. The image does not run under s6 (supervisord), so the
# s6 baseline does not apply. After a test run on the Pi (apparmor: true, evaluate the log,
# close the gaps), remove "complain" from the flags and set this to true.
apparmor: false
