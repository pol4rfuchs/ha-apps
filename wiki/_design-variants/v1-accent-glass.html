<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V1 · Accent Glass</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#03110c;--text:#eafff4;--muted:#93b7a7;--border:rgba(116,255,184,.16);--mono:"JetBrains Mono",monospace;--sans:Inter,system-ui,sans-serif}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top left,rgba(52,211,153,.2),transparent 32rem),linear-gradient(135deg,#020807,#03110c 46%,#020604);color:var(--text);font:16px/1.55 var(--sans);min-height:100vh}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(rgba(116,255,184,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(116,255,184,.035) 1px,transparent 1px);background-size:38px 38px;mask-image:radial-gradient(circle at top,#000,transparent 78%)}
.shell{position:relative;width:min(1180px,calc(100% - 32px));margin:auto;padding:24px 0 48px}
.top{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border:1px solid var(--border);border-radius:999px;background:rgba(3,17,12,.7);backdrop-filter:blur(18px);position:sticky;top:12px;z-index:5}
.brand{font-weight:800;display:flex;gap:10px;align-items:center}.mark{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,#34d399,#0f7f42);color:#02110b;font:700 .85rem var(--mono)}
.top nav{display:flex;gap:6px;font-size:.9rem}.top nav a{padding:7px 14px;border-radius:99px;color:var(--muted);text-decoration:none}.top nav a:hover{background:rgba(52,211,153,.12);color:var(--text)}
h1{font-size:clamp(2rem,5vw,3.4rem);margin:48px 0 8px;letter-spacing:-.03em}.lead{color:var(--muted);max-width:60ch}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0}.chip{font:600 .78rem var(--mono);padding:6px 12px;border-radius:99px;border:1px solid var(--border);background:rgba(8,31,22,.6);color:var(--muted);cursor:pointer}.chip.on{color:#02110b;background:#34d399;border-color:#34d399}
input{width:100%;padding:14px 18px;border-radius:16px;border:1px solid var(--border);background:rgba(8,31,22,.7);color:var(--text);font:inherit;margin-bottom:8px}
h2{font:600 .8rem var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:34px 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.card{--a:#34d399;position:relative;display:block;padding:20px;border-radius:22px;text-decoration:none;color:inherit;border:1px solid color-mix(in srgb,var(--a) 28%,transparent);background:linear-gradient(160deg,color-mix(in srgb,var(--a) 14%,#06150f),rgba(6,21,15,.8));overflow:hidden;transition:.2s}
.card::after{content:"";position:absolute;right:-40px;top:-40px;width:120px;height:120px;border-radius:50%;background:var(--a);opacity:.12;filter:blur(24px)}
.card:hover{transform:translateY(-4px);border-color:var(--a);box-shadow:0 14px 40px color-mix(in srgb,var(--a) 22%,transparent)}
.ic{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:1.3rem;background:color-mix(in srgb,var(--a) 22%,transparent);margin-bottom:12px}
.card h3{margin:0 0 6px;font:600 1.02rem var(--mono);color:var(--a)}.card p{margin:0 0 14px;color:var(--muted);font-size:.9rem}
.tags{display:flex;gap:6px}.tags span{font:.7rem var(--mono);padding:3px 9px;border-radius:99px;background:rgba(255,255,255,.06);color:var(--muted)}
footer{margin-top:50px;color:#6f9585;font:.8rem var(--mono)}
</style></head><body><div class="shell">
<header class="top"><div class="brand"><span class="mark">PF</span>Pol4rFuchs Pages</div><nav><a href="#">Portal</a><a href="#">HA Wikis</a><a href="#">GitHub ↗</a></nav></header>
<h1>HA Add-on Wikis</h1><p class="lead">Eine Wiki pro Add-on, jede mit eigener Akzentfarbe – wie auf den Detailseiten. Die Farbe der Karte ist die Farbe der Wiki.</p>
<div class="chips" id="chips"></div><input id="q" type="search" placeholder="Suchen: ntfy, Matrix, DNS …"><div id="out"></div>
<footer>© Pol4rFuchs · Static · 19 Wikis</footer></div>
<script src="apps.js"></script><script>
const chips=document.getElementById('chips'),out=document.getElementById('out');let cat='Alle';
function render(){const q=document.getElementById('q').value.toLowerCase();chips.innerHTML=['Alle',...CATS].map(c=>'<button class="chip '+(c==cat?'on':'')+'" data-c="'+c+'">'+c+'</button>').join('');
out.innerHTML=CATS.filter(c=>cat=='Alle'||c==cat).map(c=>{const l=APPS.filter(a=>a.c==c&&(a.n+a.d+a.t).toLowerCase().includes(q));return l.length?'<h2>'+c+'</h2><div class="grid">'+l.map(a=>'<a class="card" style="--a:'+a.a+'" href="#"><div class="ic">'+a.i+'</div><h3>'+a.n+'</h3><p>'+a.d+'</p><div class="tags">'+a.t.map(t=>'<span>'+t+'</span>').join('')+'</div></a>').join('')+'</div>':''}).join('')}
chips.onclick=e=>{if(e.target.dataset.c){cat=e.target.dataset.c;render()}};document.getElementById('q').oninput=render;render();</script></body></html>
