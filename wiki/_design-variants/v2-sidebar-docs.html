<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V2 · Sidebar Docs</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--accent:#34d399;--bg:#050d0a;--panel:rgba(10,30,22,.72);--border:rgba(116,255,184,.16);--text:#eafff4;--muted:#93b7a7;--mono:"JetBrains Mono",monospace;--sans:Inter,system-ui,sans-serif}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0,rgba(52,211,153,.18),transparent 30rem),var(--bg);color:var(--text);font:16px/1.55 var(--sans);display:grid;grid-template-columns:320px 1fr;min-height:100vh}
aside{position:sticky;top:12px;height:calc(100vh - 24px);margin:12px 0 12px 12px;padding:18px;border:1px solid var(--border);border-radius:24px;background:var(--panel);backdrop-filter:blur(18px);overflow:auto}
.brand{display:flex;gap:12px;align-items:center;margin-bottom:16px}.logo{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:1.4rem;background:linear-gradient(135deg,#34d399,#0f7f42)}.brand b{display:block}.brand small{font:.68rem var(--mono);color:var(--muted);letter-spacing:.12em}
input{width:100%;padding:11px 14px;border-radius:14px;border:1px solid var(--border);background:rgba(0,0,0,.35);color:var(--text);font:inherit;margin-bottom:12px}
.gt{font:.68rem var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:16px 6px 6px}
.ni{--a:#34d399;display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:12px;text-decoration:none;color:var(--muted);font-size:.9rem;border:1px solid transparent}
.ni i{width:8px;height:8px;border-radius:50%;background:var(--a);box-shadow:0 0 10px var(--a);flex:none}.ni:hover{background:color-mix(in srgb,var(--a) 12%,transparent);color:var(--text);border-color:color-mix(in srgb,var(--a) 35%,transparent)}
main{padding:12px 24px 48px;max-width:1100px}
.hero{padding:34px;border:1px solid var(--border);border-radius:28px;background:linear-gradient(135deg,rgba(52,211,153,.14),rgba(6,20,15,.7))}
.kick{font:.72rem var(--mono);letter-spacing:.14em;color:var(--accent)}h1{font-size:clamp(1.8rem,4vw,2.8rem);margin:8px 0;letter-spacing:-.02em}.hero p{color:var(--muted);max-width:60ch;margin:0}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:22px}.m{padding:12px 14px;border-radius:16px;background:rgba(0,0,0,.3);border:1px solid var(--border)}.m small{display:block;font:.66rem var(--mono);color:var(--muted);text-transform:uppercase}.m strong{font:600 1.1rem var(--mono)}
h2{font:600 .78rem var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:34px 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{--a:#34d399;display:block;padding:18px;border-radius:20px;text-decoration:none;color:inherit;background:var(--panel);border:1px solid var(--border);border-left:3px solid var(--a);transition:.2s}.card:hover{background:color-mix(in srgb,var(--a) 10%,#071510);transform:translateX(3px)}
.card h3{margin:0 0 4px;font:600 .98rem var(--mono)}.card p{margin:0;color:var(--muted);font-size:.86rem}
@media(max-width:860px){body{display:block}aside{position:static;height:auto;margin:12px}main{padding:12px}}
</style></head><body>
<aside><div class="brand"><div class="logo">🦊</div><div><b>HA Add-on Wikis</b><small>PF · GLASS DOCS</small></div></div>
<input id="q" type="search" placeholder="Search add-ons…"><div id="nav"></div>
<div class="gt">Links</div><a class="ni" href="#"><i style="--a:#93b7a7"></i>Portal</a><a class="ni" href="#"><i style="--a:#93b7a7"></i>GitHub Repo</a></aside>
<main><section class="hero"><div class="kick">● STATIC DOCS · HOME ASSISTANT</div><h1>Add-on Operations Wikis</h1><p>Gleiche Sidebar-Struktur wie jede Add-on-Wiki: Du landest im Hub und fühlst dich sofort zuhause.</p>
<div class="metrics"><div class="m"><small>Add-ons</small><strong>19</strong></div><div class="m"><small>Kategorien</small><strong>5</strong></div><div class="m"><small>Mode</small><strong>static</strong></div><div class="m"><small>Search</small><strong>local</strong></div></div></section>
<div id="out"></div></main>
<script src="apps.js"></script><script>
const nav=document.getElementById('nav'),out=document.getElementById('out'),q=document.getElementById('q');
nav.innerHTML=CATS.map(c=>'<div class="gt">'+c+'</div>'+APPS.filter(a=>a.c==c).map(a=>'<a class="ni" data-s="1" style="--a:'+a.a+'" href="#'+a.s+'"><i></i>'+a.n+'</a>').join('')).join('');
out.innerHTML=CATS.map(c=>'<h2>'+c+'</h2><div class="grid">'+APPS.filter(a=>a.c==c).map(a=>'<a class="card" id="'+a.s+'" style="--a:'+a.a+'" href="#"><h3>'+a.i+' '+a.n+'</h3><p>'+a.d+'</p></a>').join('')+'</div>').join('');
q.oninput=()=>{const v=q.value.toLowerCase();document.querySelectorAll('.card,.ni[data-s]').forEach(e=>e.hidden=!e.textContent.toLowerCase().includes(v))}
</script></body></html>
