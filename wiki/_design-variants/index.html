<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wiki Theme Switcher</title>
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0;background:#080a0d;color:#e6ebf1;font:14px system-ui,sans-serif}
body{display:flex;flex-direction:column}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 14px;background:#12161c;border-bottom:1px solid #262c35}
.bar b{margin-right:6px;font-size:.9rem}.bar button{padding:8px 14px;border-radius:99px;border:1px solid #2f3742;background:#1a2028;color:#aab4c0;cursor:pointer;font:inherit}
.bar button:hover{color:#fff}.bar button.on{background:#34d399;border-color:#34d399;color:#04140e;font-weight:600}
.sp{flex:1}.vp button{padding:6px 10px;border-radius:8px}
.stage{flex:1;display:flex;justify-content:center;background:#05070a;overflow:auto}
iframe{border:0;height:100%;width:100%;background:#fff;transition:width .2s}
.hint{color:#6b7684;font-size:.78rem}
</style></head><body>
<div class="bar"><b>🎨 Wiki-Design</b><span id="tabs"></span><span class="sp"></span>
<span class="vp"><button data-w="100%" class="on">Desktop</button> <button data-w="768px">Tablet</button> <button data-w="390px">Handy</button></span>
<span class="hint">Tasten 1–4</span></div>
<div class="stage"><iframe id="f" title="Preview"></iframe></div>
<script>
const V=[["v1-accent-glass.html","V1 Accent Glass"],["v2-sidebar-docs.html","V2 Sidebar Docs"],["v3-terminal.html","V3 Terminal"],["v4-bento.html","V4 Bento"]];
const tabs=document.getElementById('tabs'),f=document.getElementById('f');
tabs.innerHTML=V.map((v,i)=>'<button data-i="'+i+'">'+v[1]+'</button>').join(' ');
function go(i){i=Math.max(0,Math.min(3,i|0));f.src=V[i][0];tabs.querySelectorAll('button').forEach((b,j)=>b.classList.toggle('on',i==j));location.hash='v'+(i+1)}
tabs.onclick=e=>{if(e.target.dataset.i!=null)go(+e.target.dataset.i)};
document.querySelector('.vp').onclick=e=>{if(e.target.dataset.w){f.style.width=e.target.dataset.w;document.querySelectorAll('.vp button').forEach(b=>b.classList.toggle('on',b==e.target))}};
addEventListener('keydown',e=>{if(e.target.tagName!='INPUT'&&'1234'.includes(e.key))go(+e.key-1)});
go((parseInt((location.hash.match(/v(\d)/)||[])[1])||1)-1);
</script></body></html>
