<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V4 · Bento</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light dark;--bg:#f6f4ef;--card:#fff;--t:#16181d;--m:#5d6470;--b:#e4e0d6;--mono:"JetBrains Mono",monospace;--sans:Inter,system-ui,sans-serif}
@media(prefers-color-scheme:dark){:root{--bg:#0b0d10;--card:#14171c;--t:#eef1f5;--m:#8a93a0;--b:#242a32}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:16px/1.5 var(--sans)}
.w{max-width:1180px;margin:auto;padding:28px 20px 60px}header{display:flex;justify-content:space-between;align-items:center}.logo{font:800 1.1rem var(--sans)}.logo span{color:#34d399}
header a{font:.8rem var(--mono);color:var(--m);text-decoration:none;margin-left:16px}
h1{font-size:clamp(2.4rem,7vw,5rem);line-height:1;letter-spacing:-.045em;margin:56px 0 14px;max-width:14ch}h1 em{font-style:normal;background:linear-gradient(90deg,#34d399,#06b6d4,#8b5cf6,#f97316);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--m);max-width:56ch;font-size:1.1rem}
input{margin:26px 0 22px;width:100%;max-width:440px;padding:14px 20px;border-radius:99px;border:1px solid var(--b);background:var(--card);color:var(--t);font:inherit}
.bento{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:minmax(170px,auto);gap:14px;grid-auto-flow:dense}
.tile{--a:#34d399;position:relative;padding:20px;border-radius:26px;background:var(--card);border:1px solid var(--b);text-decoration:none;color:inherit;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;transition:.25s}
.tile::before{content:"";position:absolute;inset:0;background:linear-gradient(150deg,color-mix(in srgb,var(--a) 22%,transparent),transparent 60%);opacity:.7}
.tile:hover{transform:scale(1.015);border-color:var(--a)}.tile>*{position:relative}.big{grid-column:span 2;grid-row:span 2}.wide{grid-column:span 2}
.ic{font-size:2rem}.big .ic{font-size:3.6rem}.tile h3{margin:0;font:600 1rem var(--mono)}.big h3{font-size:1.5rem}.tile p{margin:6px 0 0;color:var(--m);font-size:.85rem}
.cat{font:600 .66rem var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--a)}
@media(max-width:900px){.bento{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.bento{grid-template-columns:1fr}.big,.wide{grid-column:auto;grid-row:auto}}
</style></head><body><div class="w"><header><div class="logo">Pol4r<span>Fuchs</span> / wiki</div><div><a href="#">portal</a><a href="#">github ↗</a></div></header>
<h1>Dein Homelab, <em>dokumentiert.</em></h1><p class="sub">19 Home-Assistant-Add-ons. Große Kacheln für die Stacks, die du am meisten brauchst – Light &amp; Dark automatisch.</p>
<input id="q" type="search" placeholder="Add-on suchen…"><div class="bento" id="o"></div></div>
<script src="apps.js"></script><script>
const q=document.getElementById('q'),o=document.getElementById('o');
const feat=['matrix-synapse','ntfy','nginx-proxy-manager','forgejo'],wide=['restic-backup','unifi-os-control-center','nextcloud'];
function r(){const v=q.value.toLowerCase();o.innerHTML=APPS.filter(a=>(a.n+a.d+a.c).toLowerCase().includes(v)).sort((x,y)=>feat.includes(y.s)-feat.includes(x.s)).map(a=>'<a class="tile '+(!v&&feat.includes(a.s)?'big':!v&&wide.includes(a.s)?'wide':'')+'" style="--a:'+a.a+'" href="#"><div class="ic">'+a.i+'</div><div><div class="cat">'+a.c+'</div><h3>'+a.n+'</h3><p>'+a.d+'</p></div></a>').join('')}
q.oninput=r;r();</script></body></html>
